[workspace]
resolver = "2"
members = ["crates/fairmark-core", "crates/fairmark-cli", "crates/fairmark-py"]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/salvo8519/fairmark"
homepage = "https://github.com/salvo8519/fairmark"
authors = ["The Fairmark Authors"]
keywords = ["valuation", "finance", "dcf", "decimal", "ai-agents"]
categories = ["finance", "mathematics"]

[workspace.dependencies]
fairmark-core = { path = "crates/fairmark-core", version = "0.1.0-alpha.1" }
rust_decimal = { version = "1.43", default-features = false, features = ["std", "maths", "serde-with-arbitrary-precision"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "preserve_order"] }
# JSON pointer of the field in every input error (issue #174, ADR 0013).
serde_path_to_error = "0.1.20"
schemars = { version = "1.2", features = ["rust_decimal1", "preserve_order"] }
sha2 = "0.11"
thiserror = "2"
clap = { version = "4.6", features = ["derive"] }
serde_norway = "0.9"
# Dev-only: property tests with shrinking (issue #33). Default features off: no fork or timeout;
# file persistence is disabled per test via config() in crates/fairmark-core/tests/properties.rs.
proptest = { version = "1.12", default-features = false, features = ["std"] }

# Debug builds keep only line tables: backtraces and panics still show file and line, while
# target/ is far smaller (issue #297). Use `debug = "full"` locally to step through a debugger.
[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"

# Mutation testing only (.cargo/mutants.toml): the test profile without debug information,
# for faster incremental builds of each mutant. Never used for shipped artefacts.
[profile.mutants]
inherits = "test"
debug = "none"

[profile.release]
lto = "thin"
codegen-units = 1
