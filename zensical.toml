# Documentation site — built with Zensical (https://zensical.org).
#   pip install -e ".[docs]"   then   zensical serve   (local preview)
#   zensical build --strict    (what CI runs)

[project]
site_name = "Fairmark"
site_description = "Deterministic valuation engine for analysts and AI agents — fair value, hallmarked."
site_url = "https://fairmark-dev.github.io/fairmark/"
repo_url = "https://github.com/fairmark-dev/fairmark"
repo_name = "fairmark-dev/fairmark"
edit_uri = "edit/main/docs/"
copyright = "Copyright &copy; 2026 The Fairmark Authors"
# KaTeX is vendored (docs/vendor/katex, MIT): the site loads no third-party CDN.
extra_css = ["vendor/katex/katex.min.css", "stylesheets/extra.css"]
extra_javascript = [
  "vendor/katex/katex.min.js",
  "vendor/katex/auto-render.min.js",
  "javascripts/katex.js",
]

nav = [
  { "Home" = "index.md" },
  { "Getting started" = [
    "getting-started/installation.md",
    "getting-started/quickstart.md",
    "getting-started/first-valuation-with-an-agent.md",
  ] },
  { "Guides" = [
    "guides/function-calling.md",
    "guides/mcp.md",
    "guides/coding-agents.md",
    "guides/cli.md",
  ] },
  { "Methods" = [
    "methods/index.md",
    "methods/tvm-npv.md",
    "methods/tvm-irr.md",
    "methods/dcf-fcff.md",
  ] },
  { "Concepts" = [
    "concepts/determinism.md",
    "concepts/audit-trail.md",
    "concepts/architecture.md",
  ] },
  { "Reference" = [
    "reference/python.md",
    "reference/methods.md",
    "reference/errors.md",
  ] },
  { "Project" = [
    "project/roadmap.md",
    "project/contributing.md",
    "project/changelog.md",
    "project/telemetry.md",
    { "Decisions (ADR)" = [
      "project/adr/0001-rust-core-thin-adapters.md",
      "project/adr/0002-decimal-arithmetic.md",
      "project/adr/0003-json-schema-contract.md",
      "project/adr/0004-privacy-first-telemetry.md",
      "project/adr/0005-license-and-contributions.md",
    ] },
  ] },
]

[project.theme]
language = "en"
icon.repo = "fontawesome/brands/github"
icon.logo = "lucide/scale"
features = [
  "announce.dismiss",
  "content.action.edit",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "amber"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "amber"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.extra]
social = [
  { icon = "fontawesome/brands/github", link = "https://github.com/fairmark-dev/fairmark" },
  { icon = "fontawesome/brands/python", link = "https://pypi.org/project/fairmark/" },
]

[project.plugins.search]

[project.plugins.mkdocstrings.handlers.python]
paths = ["python"]
inventories = ["https://docs.python.org/3/objects.inv"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
show_source = false
show_root_heading = true
members_order = "source"
separate_signature = true
show_signature_annotations = true

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.snippets.base_path = ["."]
pymdownx.snippets.check_paths = true
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
