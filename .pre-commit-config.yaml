# Installed by `uv run pre-commit install`. Runs fast checks on each commit;
# the full gate is `uv run just check` (and CI).
repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all --check
        language: system
        types: [rust]
        pass_filenames: false
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --check
        language: system
        types: [python]
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: system
        types: [python]
      - id: typos
        name: typos
        entry: uv run typos
        language: system
        pass_filenames: false
      - id: house-style
        name: no icons or emoji
        entry: uv run python scripts/check_style.py
        language: system
        pass_filenames: false
      - id: generate
        name: regenerate schemas, reference and .claude/ (fails if files changed; re-add them)
        entry: bash -c 'uv run just generate >/dev/null && git diff --exit-code -- schemas docs/reference .claude'
        language: system
        pass_filenames: false
        files: ^(crates/fairmark-core/src/|schemas/|docs/reference/|\.agents/|\.claude/)
      - id: docs-impact
        name: documentation updated with the code
        entry: python3 scripts/docs_sync.py impact --staged
        language: system
        pass_filenames: false
