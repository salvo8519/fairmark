# Titles follow docs/en/project/conventions.md: build(deps) for packages, ci(deps) for workflows.
version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule: { interval: weekly }
    commit-message: { prefix: "build", include: scope }
    groups: { cargo-minor: { update-types: [minor, patch] } }
  - package-ecosystem: pip
    directory: "/"
    schedule: { interval: weekly }
    commit-message: { prefix: "build", include: scope }
    groups: { python-minor: { update-types: [minor, patch] } }
  # Hashed requirements of the Release workflow (PyYAML for the smoke test, maturin for the
  # sdist build). maturin follows uv.lock: update it there and in this file together.
  - package-ecosystem: pip
    directory: "/.github/release"
    schedule: { interval: weekly }
    commit-message: { prefix: "build", include: scope }
    ignore:
      - dependency-name: maturin
  # Container images of the Release workflow, pinned by digest in the FROM line of
  # .github/release/images/*.Dockerfile: Dependabot updates the digest when the tag moves.
  # The Python versions of the smoke images follow SMOKE_PYTHONS in release.yml and ci.yml:
  # change them by hand, so version updates of python are ignored (digest updates are not).
  - package-ecosystem: docker
    directory: "/.github/release/images"
    schedule: { interval: weekly }
    commit-message: { prefix: "ci", include: scope }
    groups: { release-images: { patterns: ["*"] } }
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly }
    commit-message: { prefix: "ci", include: scope }
    # Minor and patch updates together; each major update in its own pull request
    # (docs/en/project/dependencies.md).
    groups: { actions: { patterns: ["*"], update-types: [minor, patch] } }
    ignore:
      # Pinned to the commit of its toolchain branches (stable, 1.88), which Dependabot does
      # not follow; the toolchain itself is the `toolchain` input. To update: write the ref
      # back (`@stable`), then run python scripts/pin_actions.py, which skips pinned lines.
      - dependency-name: dtolnay/rust-toolchain
