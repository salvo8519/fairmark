# Titles follow docs/en/project/conventions.md: build(deps) for packages, ci(deps) for workflows.
version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule: { interval: weekly }
    commit-message: { prefix: "build", include: scope }
    groups: { cargo-minor: { update-types: [minor, patch] } }
  - package-ecosystem: pip
    directory: "/"
    schedule: { interval: weekly }
    commit-message: { prefix: "build", include: scope }
    groups: { python-minor: { update-types: [minor, patch] } }
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly }
    commit-message: { prefix: "ci", include: scope }
    groups: { actions: { patterns: ["*"] } }
    ignore:
      # The MSRV job pins the toolchain on purpose (rust-version in Cargo.toml).
      - dependency-name: dtolnay/rust-toolchain
