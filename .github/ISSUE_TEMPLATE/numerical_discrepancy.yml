name: Numerical discrepancy
description: Fairmark returns a number that differs from a reference calculation
labels: ["bug", "numerical"]
body:
  - type: input
    id: method
    attributes: { label: Method, placeholder: dcf.fcff }
    validations: { required: true }
  - type: textarea
    id: input
    attributes: { label: Input JSON, render: json }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes:
      label: Expected values and their source
      description: Spreadsheet, textbook example, professional practice. Show how they were computed.
    validations: { required: true }
  - type: textarea
    id: actual
    attributes: { label: Fairmark output (value and meta), render: json }
    validations: { required: true }
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This report contains no real client data.
          required: true
