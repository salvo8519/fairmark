name: Bug report
description: Something does not work (installation, API, CLI, MCP)
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes: { label: What happened and what you expected }
    validations: { required: true }
  - type: textarea
    id: repro
    attributes: { label: Steps to reproduce }
    validations: { required: true }
  - type: input
    id: versions
    attributes: { label: "Versions (fairmark, Python, OS)" }
