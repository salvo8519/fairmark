name: Roadmap sync

# Reports any difference between roadmap/roadmap.yaml and GitHub: an issue closed or reopened
# without updating the file, a milestone changed on GitHub, an open issue missing from the
# roadmap. Read-only: the fix is `python scripts/roadmap.py sync --write` in a pull request.
on:
  issues:
    types: [opened, closed, reopened, milestoned, demilestoned, edited]
  schedule:
    - cron: "41 4 * * *"   # daily 04:41 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: read

concurrency:
  group: roadmap-sync
  cancel-in-progress: true

jobs:
  drift:
    name: Roadmap and GitHub agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with: { python-version: "3.13" }
      - run: python -m pip install --quiet pyyaml
      - run: python scripts/roadmap.py sync
        env:
          GH_TOKEN: ${{ github.token }}
