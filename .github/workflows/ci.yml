name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust · fmt, clippy, tests, golden
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Test-only crates stay out of the shipped dependency graph
        run: |
          out="$(cargo tree --workspace --target all -e normal,build -i proptest 2>/dev/null)"
          if [ -n "$out" ]; then
            echo "proptest is a normal or build dependency:"
            echo "$out"
            exit 1
          fi

  msrv:
    name: Rust · MSRV 1.88
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@360a4e93673de6630fac2478bc9e35244b01a759 # 1.88
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo check --workspace

  coverage:
    name: Rust · coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        id: llvm-cov-install
        continue-on-error: true
        timeout-minutes: 5
        with:
          tool: cargo-llvm-cov@0.9.1
          fallback: none
      - name: Build cargo-llvm-cov from crates.io (download failed)
        if: steps.llvm-cov-install.outcome == 'failure'
        run: cargo install --locked cargo-llvm-cov@0.9.1
      - run: cargo llvm-cov -p fairmark-core --summary-only | tee coverage.txt
      - run: |
          {
            echo '### Rust core coverage'
            echo '```'
            tail -n 3 coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  deny:
    name: Dependencies · licenses, bans, advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Tools are installed at pinned versions: install-action downloads them with retries and
      # checks their SHA-256 for at most 5 minutes; if that fails (GitHub outage on release
      # assets), the next step builds the same version from crates.io with its lockfile (#181).
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        id: deny-install
        continue-on-error: true
        timeout-minutes: 5
        with:
          tool: cargo-deny@0.20.2
          fallback: none
      - name: Build cargo-deny from crates.io (download failed)
        if: steps.deny-install.outcome == 'failure'
        run: cargo install --locked cargo-deny@0.20.2
      - name: cargo deny check
        run: cargo deny --locked --all-features check

  python:
    name: Python ${{ matrix.python }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked --all-extras --group oracles
      - run: uv run pytest
        env:
          # The oracle tests fail instead of skipping when an oracle cannot be imported.
          FAIRMARK_REQUIRE_ORACLES: "1"

  workflows:
    name: Quality · workflows, YAML, unused dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.32"
      # Security audit of the workflows: injections, permissions, credentials, pins.
      - run: uvx zizmor@1.32.0 --offline --min-severity low .github/workflows
      # Workflow syntax, runner labels and shell scripts (shellcheck is on the runner).
      - run: uvx --from actionlint-py@1.7.12.25 actionlint
      - run: python3 scripts/pin_actions.py --check
      - run: uv run --frozen --only-group dev python scripts/check_yaml.py
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        id: machete-install
        continue-on-error: true
        timeout-minutes: 5
        with:
          tool: cargo-machete@0.9.2
          fallback: none
      - name: Build cargo-machete from crates.io (download failed)
        if: steps.machete-install.outcome == 'failure'
        run: cargo install --locked cargo-machete@0.9.2
      - run: cargo machete

  quality:
    name: Quality · lint, types, typos, generated files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked --all-extras --all-groups
      - run: uv run ruff check python scripts
      - run: uv run ruff format --check python scripts
      - run: uv run mypy
      - run: uv run typos
      - run: uv run python scripts/check_style.py
      - run: uv run just check-generated
      - run: uv run python scripts/docs_sync.py coverage
      - run: uv run python scripts/docs_sync.py claims
      - run: uv run python scripts/method_status.py check
      - run: uv run python scripts/version.py check
      - name: Roadmap consistent and the closed issue planned
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"
            uv run python scripts/roadmap.py check --pr-body "$RUNNER_TEMP/pr-body.md"
          else
            uv run python scripts/roadmap.py check
          fi
      - run: for f in sprints/S*.yaml; do [ -e "$f" ] && uv run python scripts/sprint.py validate "$f"; done; true

  mutants-diff:
    name: Mutation testing · changed lines of the core
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      # Path filter inside the job, so that the check always reports and can be made required:
      # without a change under crates/fairmark-core/src the remaining steps are skipped.
      - name: Changed lines of fairmark-core
        id: diff
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git diff "origin/$BASE_REF...HEAD" -- crates/fairmark-core/src > core.diff
          if [ -s core.diff ]; then echo "changed=true" >> "$GITHUB_OUTPUT"
          else echo "No change in crates/fairmark-core/src: nothing to mutate."; fi
      - if: steps.diff.outputs.changed == 'true'
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - if: steps.diff.outputs.changed == 'true'
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        id: mutants-install
        continue-on-error: true
        timeout-minutes: 5
        with:
          tool: cargo-mutants@27.1.0
          fallback: none
      - name: Build cargo-mutants from crates.io (download failed)
        if: steps.diff.outputs.changed == 'true' && steps.mutants-install.outcome == 'failure'
        run: cargo install --locked cargo-mutants@27.1.0
      - name: cargo mutants --in-diff (configuration in .cargo/mutants.toml)
        if: steps.diff.outputs.changed == 'true'
        run: |
          status=0
          cargo mutants --package fairmark-core --no-shuffle --in-diff core.diff --output . \
            || status=$?
          # 2 = missed, 3 = timeout: decided by the gate below, which applies the reviewed
          # equivalent mutants (tests/mutants/equivalent.toml). Anything else fails here.
          if [ "$status" -ne 0 ] && [ "$status" -ne 2 ] && [ "$status" -ne 3 ]; then
            exit "$status"
          fi
      - name: Gate on missed mutants not recorded as equivalent
        if: steps.diff.outputs.changed == 'true'
        run: |
          set -o pipefail
          python3 scripts/mutants.py summary mutants.out --gate --allow-empty \
            --title "Mutation testing of the changed lines" | tee -a "$GITHUB_STEP_SUMMARY"
      - if: always() && steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mutants-diff
          path: mutants.out
          if-no-files-found: ignore
          retention-days: 14

  contracts:
    name: Contracts · schema changes and golden cases
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked --all-extras --all-groups
      - name: Golden cases unchanged (or labelled numerical-change)
        run: |
          uv run python scripts/check_golden_changes.py --base "origin/$GITHUB_BASE_REF" \
            ${{ contains(github.event.pull_request.labels.*.name, 'numerical-change') && '--allowed' || '' }}
      - name: Documentation updated with the code (or labelled no-docs-needed)
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'no-docs-needed') }}
        run: python3 scripts/docs_sync.py impact --base "origin/$GITHUB_BASE_REF"
      - name: Release note fragment for user-facing changes (or labelled no-release-note)
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'no-release-note') }}
        run: |
          if git diff --name-only "origin/$GITHUB_BASE_REF...HEAD" | grep -qE '^(crates/[^/]+/src/|python/fairmark/)'; then
            uv run towncrier check --compare-with "origin/$GITHUB_BASE_REF"
          else
            echo "No user-facing source changes."
          fi
      - name: Schema history is immutable and changes are additive
        run: |
          # Exit 3: breaking change to an existing schema version (bump the method version).
          # Exit 4: history rewritten (earlier version, index entry or current version altered).
          # There is no override label: a breaking change always means a new method version.
          git worktree add /tmp/base "origin/$GITHUB_BASE_REF"
          if [ -d /tmp/base/schemas ]; then
            uv run python scripts/schema_snapshots.py --diff-against /tmp/base/schemas
          fi
