name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust · fmt, clippy, tests, golden
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  msrv:
    name: Rust · MSRV 1.88
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace

  coverage:
    name: Rust · coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov -p fairmark-core --summary-only | tee coverage.txt
      - run: |
          echo '### Rust core coverage' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 3 coverage.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  deny:
    name: Dependencies · licenses, bans, advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  python:
    name: Python ${{ matrix.python }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked --all-extras --group oracles
      - run: uv run pytest

  quality:
    name: Quality · lint, types, typos, generated files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked --all-extras --all-groups
      - run: uv run ruff check python scripts
      - run: uv run ruff format --check python scripts
      - run: uv run mypy
      - run: uv run typos
      - run: uv run python scripts/check_style.py
      - run: uv run just check-generated
      - run: uv run python scripts/docs_sync.py coverage
      - run: uv run python scripts/version.py check
      - run: for f in sprints/S*.yaml; do [ -e "$f" ] && uv run python scripts/sprint.py validate "$f"; done; true

  contracts:
    name: Contracts · schema changes and golden cases
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked --all-extras --all-groups
      - name: Golden cases unchanged (or labelled numerical-change)
        run: |
          uv run python scripts/check_golden_changes.py --base origin/${{ github.base_ref }} \
            ${{ contains(github.event.pull_request.labels.*.name, 'numerical-change') && '--allowed' || '' }}
      - name: Documentation updated with the code (or labelled no-docs-needed)
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'no-docs-needed') }}
        run: python3 scripts/docs_sync.py impact --base origin/${{ github.base_ref }}
      - name: Release note fragment for user-facing changes (or labelled no-release-note)
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'no-release-note') }}
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -qE '^(crates/[^/]+/src/|python/fairmark/)'; then
            uv run towncrier check --compare-with origin/${{ github.base_ref }}
          else
            echo "No user-facing source changes."
          fi
      - name: Schema history is immutable and changes are additive
        run: |
          # Exit 3: breaking change to an existing schema version (bump the method version).
          # Exit 4: history rewritten (earlier version, index entry or current version altered).
          # There is no override label: a breaking change always means a new method version.
          git worktree add /tmp/base origin/${{ github.base_ref }}
          if [ -d /tmp/base/schemas ]; then
            uv run python scripts/schema_snapshots.py --diff-against /tmp/base/schemas
          fi
