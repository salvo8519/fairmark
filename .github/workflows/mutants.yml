name: Mutation testing

# Weekly mutation testing of fairmark-core, one slice per week (issue #368). The slice of a
# week follows a fixed rotation (tests/mutants/budget.toml): every mutant of the core is
# tested once per cycle, and each slice fits the weekly time budget. Report only: missed
# mutants are listed for triage in the job summary and do not fail the run; a failing plan or
# baseline, a tool failure, and a shard that did not test every mutant ("mutation coverage
# incomplete": runner lost, time budget reached) do, and a failed scheduled run opens (or
# updates) the issue labelled `maintenance`. The release gate on missed mutants is #283.
# Pull requests test only their changed lines (job "Mutation testing · changed lines of the
# core" in ci.yml). Policy and triage rules: docs/en/project/mutation-testing.md.
on:
  schedule:
    - cron: "41 1 * * 0"   # Sunday 01:41 UTC, outside the weekly maintenance run
  workflow_dispatch:
    inputs:
      slice:
        description: "Index of the slice (python scripts/mutants.py slice --index N); empty for this week's slice"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: mutants-${{ github.ref }}
  # A run in progress is never cancelled: a manual run waits for the scheduled one to finish.
  cancel-in-progress: false

jobs:
  run:
    name: Mutation testing · weekly slice
    # The pinned actionlint (1.7.12) rejects the self-repository form $/ that zizmor suggests.
    uses: ./.github/workflows/mutants-run.yml  # zizmor: ignore[self-repository]
    permissions:
      contents: read
      actions: read
    with:
      kind: weekly
      slice: ${{ inputs.slice || '' }}

  report:
    name: Open or update the maintenance issue
    needs: run
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The only job with a write permission, and only on issues.
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RESULT: ${{ needs.run.result }}
        run: |
          body="Weekly mutation testing failed (${RESULT}). Run: ${RUN}. Missed mutants alone do not fail it: look in the run summary for \"Mutation coverage incomplete\" (a runner lost is an infrastructure failure: re-run the failed jobs; a time budget reached means the slice no longer fits its budget), a failing plan or baseline, or a tool failure (docs/en/project/mutation-testing.md)."
          n=$(gh issue list -R "$GITHUB_REPOSITORY" --label maintenance --state open --json number -q '.[0].number')
          if [ -n "$n" ]; then gh issue comment "$n" -R "$GITHUB_REPOSITORY" --body "$body"
          else gh issue create -R "$GITHUB_REPOSITORY" --title "Weekly maintenance report" --label maintenance --body "$body"; fi
