name: Release

# Builds, tests and publishes a release (docs/en/project/releases.md).
#
# - A tag v<version> pushed on a commit of main runs everything: version check, wheels for
#   every platform and the sdist, a smoke test of each package (install in a new environment,
#   run every golden case), build provenance, then PyPI, crates.io and the GitHub Release.
#   PyPI and crates.io use trusted publishing (OIDC), each behind a GitHub environment that
#   requires the maintainer's approval.
# - Run workflow (workflow_dispatch) is the dry run: the same builds and tests, and
#   `cargo publish --dry-run`, without publishing anything, whatever the ref.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  # Wheels are tested on the oldest and the newest Python version that CI tests (ci.yml).
  # The wheels are abi3 (cp310-abi3): one wheel per platform serves Python 3.10 and later.
  SMOKE_PYTHONS: "3.10 3.13"
  SMOKE_PYYAML: "6.0.3"

jobs:
  version:
    name: Version and tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0   # the history of main, to check where the tag points
      - run: python3 scripts/version.py check
      - name: The tag is on main
        if: github.event_name == 'push'
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag $GITHUB_REF_NAME is not on main: tag the merge commit of the release pull request"
            exit 1
          fi
      - name: Dry run notice
        if: github.event_name != 'push'
        run: |
          echo "Dry run on $GITHUB_REF_NAME at $GITHUB_SHA: builds and tests only, nothing is published." >> "$GITHUB_STEP_SUMMARY"

  wheels:
    name: Wheel ${{ matrix.platform }}
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x86_64-manylinux, os: ubuntu-latest, target: x86_64-unknown-linux-gnu, manylinux: auto, smoke: host }
          - { platform: linux-aarch64-manylinux, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, manylinux: auto, smoke: host }
          - { platform: linux-x86_64-musllinux, os: ubuntu-latest, target: x86_64-unknown-linux-musl, manylinux: musllinux_1_2, smoke: alpine }
          - { platform: linux-aarch64-musllinux, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, manylinux: musllinux_1_2, smoke: alpine }
          - { platform: macos-x86_64, os: macos-15-intel, target: x86_64-apple-darwin, manylinux: auto, smoke: host }
          - { platform: macos-arm64, os: macos-14, target: aarch64-apple-darwin, manylinux: auto, smoke: host }
          - { platform: windows-x86_64, os: windows-latest, target: x86_64-pc-windows-msvc, manylinux: auto, smoke: host }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Every wheel is built on a runner of its own architecture, so that it can be tested
      # there. `manylinux` is ignored outside Linux.
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --out dist
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        if: matrix.smoke == 'host'
        with:
          version: "0.11.32"
          enable-cache: false   # no cache in a workflow that publishes
      - name: Smoke test in new environments
        if: matrix.smoke == 'host'
        run: |
          for py in $SMOKE_PYTHONS; do
            echo "::group::Python $py"
            venv="$RUNNER_TEMP/smoke-$py"
            uv venv --no-project --python "$py" "$venv"
            uv pip install --python "$venv" --no-index --find-links dist --only-binary fairmark fairmark
            uv pip install --python "$venv" --only-binary :all: "pyyaml==$SMOKE_PYYAML"
            if [ "$RUNNER_OS" = "Windows" ]; then bin="$venv/Scripts/python.exe"; else bin="$venv/bin/python"; fi
            "$bin" -I scripts/smoke_wheel.py
            echo "::endgroup::"
          done
      # musllinux wheels are tested on Alpine Linux, which uses musl. The checkout, including
      # dist/, is mounted read-only: the container cannot change the wheel that is uploaded.
      # The images are the official Python images, by tag.
      - name: Smoke test in new environments (Alpine Linux)
        if: matrix.smoke == 'alpine'
        run: |
          for py in $SMOKE_PYTHONS; do
            echo "::group::Python $py on Alpine"
            docker run --rm -v "$PWD:/src:ro" -w /tmp -e SMOKE_PYYAML "python:$py-alpine" sh -euc '
              python -m venv /tmp/venv
              /tmp/venv/bin/pip install --disable-pip-version-check --no-index --find-links /src/dist --only-binary fairmark fairmark
              /tmp/venv/bin/pip install --disable-pip-version-check --only-binary :all: "pyyaml==$SMOKE_PYYAML"
              /tmp/venv/bin/python -I /src/scripts/smoke_wheel.py
            '
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist-${{ matrix.platform }}
          path: dist
          if-no-files-found: error

  sdist:
    name: Source distribution
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.32"
          enable-cache: false   # no cache in a workflow that publishes
      # What a user without a matching wheel gets: a build from the sdist alone.
      - name: Build from the sdist and smoke test
        run: |
          venv="$RUNNER_TEMP/smoke-sdist"
          uv venv --no-project --python 3.13 "$venv"
          uv pip install --python "$venv" --no-binary fairmark dist/fairmark-*.tar.gz
          uv pip install --python "$venv" --only-binary :all: "pyyaml==$SMOKE_PYYAML"
          "$venv/bin/python" -I scripts/smoke_wheel.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist-sdist
          path: dist
          if-no-files-found: error

  dist-check:
    name: Distributions complete
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.32"
          enable-cache: false   # no cache in a workflow that publishes
      - name: One wheel per platform and the sdist, all of this version
        run: |
          version="$(python3 scripts/version.py show --python)"
          ls -l dist
          problems=0
          for pattern in \
            "fairmark-$version-cp310-abi3-manylinux*_x86_64.whl" \
            "fairmark-$version-cp310-abi3-manylinux*_aarch64.whl" \
            "fairmark-$version-cp310-abi3-musllinux_*_x86_64.whl" \
            "fairmark-$version-cp310-abi3-musllinux_*_aarch64.whl" \
            "fairmark-$version-cp310-abi3-macosx_*_x86_64.whl" \
            "fairmark-$version-cp310-abi3-macosx_*_arm64.whl" \
            "fairmark-$version-cp310-abi3-win_amd64.whl" \
            "fairmark-$version.tar.gz"; do
            found=$(find dist -maxdepth 1 -type f -name "$pattern" | wc -l)
            if [ "$found" -ne 1 ]; then
              echo "::error::expected one file matching $pattern, found $found"
              problems=1
            fi
          done
          total=$(find dist -type f | wc -l)
          if [ "$total" -ne 8 ]; then
            echo "::error::expected 8 files in dist, found $total"
            problems=1
          fi
          exit "$problems"
      - run: uvx twine@7.0.0 check --strict dist/*

  crates-package:
    name: Crates package and verify (dry run)
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      # --workspace publishes the crates in dependency order and skips those with
      # `publish = false` (fairmark-py, shipped to PyPI as the wheels).
      - run: cargo publish --dry-run --locked --workspace

  attest:
    name: Build provenance
    needs: [dist-check, crates-package]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write          # sign the attestation (Sigstore)
      attestations: write      # store it in the repository
      artifact-metadata: write # record the attested files
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*

  publish-pypi:
    name: Publish to PyPI (trusted publishing)
    needs: attest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/fairmark/
    permissions:
      id-token: write   # OIDC token for PyPI trusted publishing; no stored token
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      # Also uploads PEP 740 attestations of every file (the default with trusted publishing).
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  publish-crates:
    name: Publish to crates.io
    # A crate on crates.io cannot be withdrawn: publish only after every check, build and the
    # PyPI upload.
    needs: [publish-pypi, crates-package]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: crates-io
      url: https://crates.io/crates/fairmark-core
    permissions:
      id-token: write   # OIDC token for crates.io trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      # crates.io accepts trusted publishing only for crates that already exist. For the first
      # release the maintainer stores a short-lived, scoped token as the secret
      # CARGO_REGISTRY_TOKEN of the crates-io environment, and deletes it afterwards
      # (docs/en/project/releases.md). Without that secret the job uses trusted publishing.
      - name: Authentication mode
        id: mode
        env:
          BOOTSTRAP_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -n "$BOOTSTRAP_TOKEN" ]; then
            echo "::warning::publishing with the CARGO_REGISTRY_TOKEN secret of the crates-io environment; delete it once trusted publishing is configured"
            echo "bootstrap=true" >> "$GITHUB_OUTPUT"
          else
            echo "bootstrap=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
        if: steps.mode.outputs.bootstrap != 'true'
      - run: cargo publish --locked --workspace
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}

  github-release:
    name: GitHub Release with release notes
    needs: publish-crates
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # create the release and upload the files
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: python3 scripts/release_notes.py "${GITHUB_REF_NAME}" > "$RUNNER_TEMP/body.md"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          body_path: ${{ runner.temp }}/body.md
          files: dist/*
          prerelease: ${{ contains(github.ref_name, '-') }}
