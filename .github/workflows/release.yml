name: Release

# Builds, tests and publishes a release (docs/en/project/releases.md).
#
# - A tag v<version> pushed on a commit of main runs everything: version check, wheels for
#   every platform and the sdist, a smoke test of each package (install in a new environment,
#   run every golden case), then PyPI (with build provenance), crates.io and the GitHub
#   Release. PyPI and crates.io use trusted publishing (OIDC). Every job that can request an
#   OIDC token runs in a GitHub environment that requires the maintainer's approval.
# - Run workflow (workflow_dispatch) is the dry run: the same builds and tests, and
#   `cargo publish --dry-run`. The publishing jobs run only on a tag push, so a manual run
#   never reaches them and uses no environment.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  # Wheels are tested on the oldest and the newest Python version that CI tests (ci.yml).
  # The wheels are abi3 (cp312-abi3): one wheel per platform serves Python 3.12 and later.
  SMOKE_PYTHONS: "3.12 3.15"
  # The maturin that builds the packages: the version locked in uv.lock (checked below).
  MATURIN_VERSION: "1.16.0"

jobs:
  version:
    name: Version and tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0   # the history of main, to check where the tag points
      - run: python3 scripts/version.py check
      - name: maturin is the version locked in uv.lock
        run: |
          locked="$(python3 -c 'import tomllib; print(next(p["version"] for p in tomllib.load(open("uv.lock", "rb"))["package"] if p["name"] == "maturin"))')"
          if [ "$locked" != "$MATURIN_VERSION" ]; then
            echo "::error::MATURIN_VERSION is $MATURIN_VERSION, uv.lock has maturin $locked"
            exit 1
          fi
          if ! grep -q "^maturin==$MATURIN_VERSION " .github/release/build-requirements.txt; then
            echo "::error::.github/release/build-requirements.txt does not pin maturin==$MATURIN_VERSION"
            exit 1
          fi
      # Guards against mistakes only (a tag on the wrong commit). It is not a security
      # control: the maintainer checks the commit of the run before approving the
      # environments (docs/en/project/releases.md).
      - name: The tag is on main
        if: github.event_name == 'push'
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag $GITHUB_REF_NAME is not on main: tag the merge commit of the release pull request"
            exit 1
          fi
      - name: Dry run notice
        if: github.event_name != 'push'
        run: |
          echo "Dry run on $GITHUB_REF_NAME at $GITHUB_SHA: builds and tests only, nothing is published." >> "$GITHUB_STEP_SUMMARY"

  wheels:
    name: Wheel ${{ matrix.platform }}
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # build-image: the container that builds a Linux wheel, pinned by digest in
          # .github/release/images/<build-image>.Dockerfile.
          - { platform: linux-x86_64-manylinux, os: ubuntu-latest, target: x86_64-unknown-linux-gnu, manylinux: auto, build-image: manylinux2014-x86_64, smoke: host }
          - { platform: linux-aarch64-manylinux, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, manylinux: auto, build-image: manylinux2014-aarch64, smoke: host }
          - { platform: linux-x86_64-musllinux, os: ubuntu-latest, target: x86_64-unknown-linux-musl, manylinux: musllinux_1_2, build-image: rust-musl-cross-x86_64, smoke: alpine }
          - { platform: linux-aarch64-musllinux, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, manylinux: musllinux_1_2, build-image: rust-musl-cross-aarch64, smoke: alpine }
          - { platform: macos-x86_64, os: macos-15-intel, target: x86_64-apple-darwin, manylinux: auto, smoke: host }
          - { platform: macos-arm64, os: macos-14, target: aarch64-apple-darwin, manylinux: auto, smoke: host }
          - { platform: windows-x86_64, os: windows-latest, target: x86_64-pc-windows-msvc, manylinux: auto, smoke: host }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Linux wheels are built in a container pinned by digest, not by tag: the FROM line of
      # .github/release/images/<build-image>.Dockerfile, which Dependabot keeps current.
      # The step fails when that line is not pinned by digest.
      - name: Pinned build image
        id: build-image
        if: runner.os == 'Linux'
        env:
          BUILD_IMAGE: ${{ matrix.build-image }}
        run: |
          image="$(bash .github/release/pinned-image.sh "$BUILD_IMAGE")"
          echo "Build image: $image"
          echo "image=$image" >> "$GITHUB_OUTPUT"
      # Every wheel is built on a runner of its own architecture, so that it can be tested
      # there. `manylinux` and `container` are ignored outside Linux.
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v${{ env.MATURIN_VERSION }}
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          container: ${{ steps.build-image.outputs.image }}
          args: --release --locked --out dist
      # Uploaded before the smoke tests run, so that nothing they execute can change it.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist-${{ matrix.platform }}
          path: dist
          if-no-files-found: error
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: matrix.smoke == 'host'
        with:
          version: "0.13.7"
          enable-cache: false   # no cache in a workflow that publishes
      - name: Smoke test in new environments
        if: matrix.smoke == 'host'
        run: |
          for py in $SMOKE_PYTHONS; do
            echo "::group::Python $py"
            venv="$RUNNER_TEMP/smoke-$py"
            uv venv --no-project --python "$py" "$venv"
            uv pip install --python "$venv" --no-index --find-links dist --only-binary fairmark fairmark
            uv pip install --python "$venv" --require-hashes -r .github/release/smoke-requirements.txt
            if [ "$RUNNER_OS" = "Windows" ]; then bin="$venv/Scripts/python.exe"; else bin="$venv/bin/python"; fi
            "$bin" -I scripts/smoke_wheel.py
            echo "::endgroup::"
          done
      # musllinux wheels are tested on Alpine Linux, which uses musl. The checkout, including
      # dist/, is mounted read-only. The images are the official Python images, pinned by
      # digest in .github/release/images/smoke-python<version>-alpine.Dockerfile (one file
      # per version in SMOKE_PYTHONS; a missing or unpinned file fails the step).
      - name: Smoke test in new environments (Alpine Linux)
        if: matrix.smoke == 'alpine'
        run: |
          for py in $SMOKE_PYTHONS; do
            echo "::group::Python $py on Alpine"
            image="$(bash .github/release/pinned-image.sh "smoke-python$py-alpine")"
            echo "Smoke image: $image"
            docker run --rm -v "$PWD:/src:ro" -w /tmp "$image" sh -euc '
              python -m venv /tmp/venv
              /tmp/venv/bin/pip install --disable-pip-version-check --no-index --find-links /src/dist --only-binary fairmark fairmark
              /tmp/venv/bin/pip install --disable-pip-version-check --require-hashes -r /src/.github/release/smoke-requirements.txt
              /tmp/venv/bin/python -I /src/scripts/smoke_wheel.py
            '
            echo "::endgroup::"
          done

  sdist:
    name: Source distribution
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v${{ env.MATURIN_VERSION }}
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist-sdist
          path: dist
          if-no-files-found: error
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: false   # no cache in a workflow that publishes
      # What a user without a matching wheel gets: a build from the sdist alone. The build
      # backend comes from a hashed requirements file, not from build isolation.
      - name: Build from the sdist and smoke test
        run: |
          venv="$RUNNER_TEMP/smoke-sdist"
          uv venv --no-project --python 3.13 "$venv"
          uv pip install --python "$venv" --require-hashes -r .github/release/build-requirements.txt
          uv pip install --python "$venv" --no-build-isolation --no-binary fairmark dist/fairmark-*.tar.gz
          uv pip install --python "$venv" --require-hashes -r .github/release/smoke-requirements.txt
          "$venv/bin/python" -I scripts/smoke_wheel.py

  dist-check:
    name: Distributions complete
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          path: src
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: dist-*
          path: release/dist
          merge-multiple: true
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: false   # no cache in a workflow that publishes
      - name: One wheel per platform and the sdist, all of this version
        working-directory: release
        run: |
          version="$(python3 ../src/scripts/version.py show --python)"
          ls -l dist
          problems=0
          for pattern in \
            "fairmark-$version-cp312-abi3-manylinux*_x86_64.whl" \
            "fairmark-$version-cp312-abi3-manylinux*_aarch64.whl" \
            "fairmark-$version-cp312-abi3-musllinux_*_x86_64.whl" \
            "fairmark-$version-cp312-abi3-musllinux_*_aarch64.whl" \
            "fairmark-$version-cp312-abi3-macosx_*_x86_64.whl" \
            "fairmark-$version-cp312-abi3-macosx_*_arm64.whl" \
            "fairmark-$version-cp312-abi3-win_amd64.whl" \
            "fairmark-$version.tar.gz"; do
            found=$(find dist -maxdepth 1 -type f -name "$pattern" | wc -l)
            if [ "$found" -ne 1 ]; then
              echo "::error::expected one file matching $pattern, found $found"
              problems=1
            fi
          done
          total=$(find dist -type f | wc -l)
          if [ "$total" -ne 8 ]; then
            echo "::error::expected 8 files in dist, found $total"
            problems=1
          fi
          exit "$problems"
      - run: uvx twine@7.0.0 check --strict release/dist/*
      # The files that every later job publishes, fixed here by their SHA-256.
      - name: SHA256SUMS
        working-directory: release
        run: |
          sha256sum dist/* > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-dist
          path: |
            release/dist
            release/SHA256SUMS
          if-no-files-found: error

  crates-package:
    name: Crates package and verify (dry run)
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      # --workspace publishes the crates in dependency order and skips those with
      # `publish = false` (fairmark-py, shipped to PyPI as the wheels).
      - run: cargo publish --dry-run --locked --workspace

  publish-pypi:
    name: Publish to PyPI (trusted publishing, provenance)
    needs: [dist-check, crates-package]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/fairmark/
    permissions:
      id-token: write          # OIDC: Sigstore signature and PyPI trusted publishing
      attestations: write      # store the provenance attestation in the repository
      artifact-metadata: write # record the attested files
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-dist
          path: release
      - name: Files are the ones checked
        working-directory: release
        run: sha256sum -c SHA256SUMS
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/dist/*
      # Also uploads PEP 740 attestations of every file (the default with trusted publishing).
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: release/dist/

  publish-crates:
    name: Publish to crates.io
    # A crate on crates.io cannot be withdrawn: publish only after every check, build and the
    # PyPI upload.
    needs: [publish-pypi, crates-package]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: crates-io
      url: https://crates.io/crates/fairmark-core
    permissions:
      id-token: write   # OIDC token for crates.io trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      # crates.io accepts trusted publishing only for crates that already exist. The token in
      # the secret CARGO_REGISTRY_TOKEN of the crates-io environment is accepted only for the
      # first release, while fairmark-core is not on crates.io yet
      # (docs/en/project/releases.md).
      - name: Authentication mode
        id: mode
        env:
          BOOTSTRAP_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -A "fairmark-release (https://github.com/$GITHUB_REPOSITORY)" \
            https://crates.io/api/v1/crates/fairmark-core)
          case "$status" in
            200)
              if [ -n "$BOOTSTRAP_TOKEN" ]; then
                echo "::error::fairmark-core exists on crates.io: delete CARGO_REGISTRY_TOKEN and use trusted publishing"
                exit 1
              fi
              echo "bootstrap=false" >> "$GITHUB_OUTPUT"
              ;;
            404)
              if [ -z "$BOOTSTRAP_TOKEN" ]; then
                echo "::error::fairmark-core is not on crates.io yet: the first release needs the CARGO_REGISTRY_TOKEN secret of the crates-io environment"
                exit 1
              fi
              echo "::warning::first release: publishing with the CARGO_REGISTRY_TOKEN secret; delete it afterwards"
              echo "bootstrap=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::crates.io answered $status for fairmark-core"
              exit 1
              ;;
          esac
      # Packaging and verification build the crates; they run without any token.
      - run: cargo publish --dry-run --locked --workspace
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
        if: steps.mode.outputs.bootstrap != 'true'
      - run: cargo publish --locked --workspace --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}

  github-release:
    name: GitHub Release with release notes
    needs: publish-crates
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # create the release and upload the files
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-dist
          path: release
      - name: Files are the ones checked
        working-directory: release
        run: sha256sum -c SHA256SUMS
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release_notes.py "$GITHUB_REF_NAME" > "$RUNNER_TEMP/body.md"
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/body.md" "${flags[@]}" \
            release/dist/* release/SHA256SUMS
