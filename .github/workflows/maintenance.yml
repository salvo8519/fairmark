name: Weekly maintenance

# Early warning, never blocking: tests against the newest compatible dependencies, security
# advisories, broken links, the required checks of the ruleset and the protection of the App
# environment. A failure opens (or updates) one issue labelled `maintenance`; the next green
# scheduled run closes it (scripts/failure_issue.py). Mutation testing has its own workflow and
# its own issue (mutants.yml).
# Policy: docs/en/project/dependencies.md.
on:
  schedule:
    - cron: "17 5 * * 1"   # Monday 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  latest-deps:
    name: Tests with the newest compatible dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Upgrade lock files (not committed)
        run: |
          cargo update --verbose 2>&1 | tee cargo-update.txt
          uv lock --upgrade 2>&1 | tee uv-upgrade.txt
      - run: cargo test --workspace --locked
      - run: uv sync --all-extras --group dev && uv run pytest -q

  audit:
    name: Security advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # cargo-deny 0.20.2: install-action downloads it with retries and checks its SHA-256.
      # If the download still fails (GitHub outage on release assets), the next step builds the
      # same version from crates.io with its published lockfile (#181).
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        id: deny-install
        continue-on-error: true
        timeout-minutes: 5
        with:
          tool: cargo-deny@0.20.2
          fallback: none
      - name: Build cargo-deny from crates.io (download failed)
        if: steps.deny-install.outcome == 'failure'
        run: cargo install --locked cargo-deny@0.20.2
      - name: cargo deny check advisories
        run: cargo deny --locked --all-features check advisories
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: pip-audit on the locked Python dependencies
        run: |
          uv export --frozen --all-extras --all-groups --no-emit-project --no-hashes -o requirements.txt
          uvx pip-audit@2.10.1 --strict -r requirements.txt

  links:
    name: Links in documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: --no-progress --max-retries 3 --exclude-path docs/_shared/vendor './**/*.md'
          fail: true

  required-checks:
    name: Required checks match the ruleset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.13"
          enable-cache: false
      - env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-project --with pyyaml python scripts/required_checks.py remote --repo "$GITHUB_REPOSITORY"

  environments:
    name: The App environment keeps its protection
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      # The setting that keeps the App key away from branches (#372): the environment
      # fairmark-app is usable from main only. Repository secrets cannot be listed with this
      # token; the maintainer checks them (docs/en/project/maintainers.md).
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api() { gh api -H "Accept: application/vnd.github+json" "repos/$GITHUB_REPOSITORY/$1"; }
          fail=0
          app=$(api environments/fairmark-app)
          echo "$app" | jq -e '.can_admins_bypass == false and .deployment_branch_policy.custom_branch_policies == true' >/dev/null || { echo "::error::fairmark-app: not limited to selected branches, or administrators can bypass"; fail=1; }
          branches=$(api environments/fairmark-app/deployment-branch-policies | jq -c '[.branch_policies[] | {name, type}]')
          [ "$branches" = '[{"name":"main","type":"branch"}]' ] || { echo "::error::fairmark-app: deployment rules are $branches, expected the branch main only"; fail=1; }
          exit "$fail"

  report:
    name: Open, update or close the maintenance issue
    needs: [latest-deps, audit, links, required-checks, environments]
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # The standard library only: no dependency is installed in a job that holds a write token.
      - env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RESULTS: >-
            latest-deps=${{ needs.latest-deps.result }}, audit=${{ needs.audit.result }},
            links=${{ needs.links.result }},
            required-checks=${{ needs.required-checks.result }},
            environments=${{ needs.environments.result }}
        run: |
          case "$RESULTS" in
            *=failure*) conclusion=failure ;;
            *=cancelled*) conclusion=cancelled ;;
            *) conclusion=success ;;
          esac
          # Only the jobs that did not succeed go into the issue.
          jobs=$(printf '%s' "$RESULTS" | tr ',' '\n' | sed 's/^ *//' \
            | grep -v -E '^$|=(success|skipped)$' | paste -sd, -) || jobs=""
          echo "Triage with the dependency policy (docs/en/project/dependencies.md)." > details.md
          # The title is the one of the issue already open, so that issue is updated and closed.
          python3 scripts/failure_issue.py report --repo "$GITHUB_REPOSITORY" \
            --workflow "Weekly maintenance" --run-id "$GITHUB_RUN_ID" --run-url "$RUN_URL" \
            --conclusion "$conclusion" --event schedule --branch main --label maintenance \
            --title "Weekly maintenance report" --jobs "$jobs" --details details.md
