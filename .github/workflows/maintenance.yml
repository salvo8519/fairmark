name: Weekly maintenance

# Early warning, never blocking: tests against the newest compatible dependencies, security
# advisories, broken links and mutation testing of the core. A failure opens (or updates) one
# issue labelled `maintenance`. Policy: docs/en/project/dependencies.md.
on:
  schedule:
    - cron: "17 5 * * 1"   # Monday 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  latest-deps:
    name: Tests with the newest compatible dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Upgrade lock files (not committed)
        run: |
          cargo update --verbose 2>&1 | tee cargo-update.txt
          uv lock --upgrade 2>&1 | tee uv-upgrade.txt
      - run: cargo test --workspace --locked
      - run: uv sync --all-extras --group dev && uv run pytest -q

  audit:
    name: Security advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with: { command: check advisories }
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: pip-audit on the locked Python dependencies
        run: |
          uv export --frozen --all-extras --no-emit-project --no-hashes -o requirements.txt
          uvx pip-audit@2.10.1 --strict -r requirements.txt

  links:
    name: Links in documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: --no-progress --max-retries 3 --exclude-path docs/_shared/vendor './**/*.md'
          fail: true

  mutants:
    name: Mutation testing of fairmark-core
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2
        with: { tool: cargo-mutants }
      - run: cargo mutants --package fairmark-core --timeout 300 --no-shuffle
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with: { name: mutants-report, path: mutants.out, if-no-files-found: ignore }

  report:
    name: Open or update the maintenance issue
    needs: [latest-deps, audit, links, mutants]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RESULTS: >-
            latest-deps=${{ needs.latest-deps.result }}, audit=${{ needs.audit.result }},
            links=${{ needs.links.result }}, mutants=${{ needs.mutants.result }}
        run: |
          body="Weekly maintenance found problems: ${RESULTS}. Run: ${RUN}. Triage with the dependency policy (docs/en/project/dependencies.md)."
          n=$(gh issue list -R "$GITHUB_REPOSITORY" --label maintenance --state open --json number -q '.[0].number')
          if [ -n "$n" ]; then gh issue comment "$n" -R "$GITHUB_REPOSITORY" --body "$body"
          else gh issue create -R "$GITHUB_REPOSITORY" --title "Weekly maintenance report" --label maintenance --body "$body"; fi
