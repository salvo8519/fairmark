# Adds every new issue and pull request to the "Fairmark roadmap" project.
# Needs: repository variable PROJECT_URL (e.g. https://github.com/users/salvo8519/projects/1)
# and secret PROJECT_TOKEN (fine-grained PAT with Projects read/write). Skipped otherwise.
#
# pull_request_target, not pull_request (#372): the workflow then always runs as it is on
# `main`, so a branch that edits this file cannot read PROJECT_TOKEN. It checks out no code and
# runs nothing from the pull request: it only adds the pull request to the project.
name: Project sync

on:  # zizmor: ignore[dangerous-triggers] no checkout, no code from the pull request
  issues:
    types: [opened, reopened, transferred]
  pull_request_target:
    types: [opened, reopened]

permissions:
  contents: read

jobs:
  add:
    if: vars.PROJECT_URL != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/add-to-project@f2c1f1fa649a891be84948ea89b5dfba1526ef05 # v2.0.1
        with:
          project-url: ${{ vars.PROJECT_URL }}
          github-token: ${{ secrets.PROJECT_TOKEN }}
