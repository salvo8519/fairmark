name: PR hygiene

# Naming and traceability rules from docs/en/project/conventions.md, enforced by
# scripts/conventions.py (the same code as the local commit-msg hook), plus area labels.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  conventions:
    name: Title, branch and linked issue
    runs-on: ubuntu-latest
    steps:
      # Only the base branch is checked out: no code from the pull request is executed.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: python scripts/conventions.py pr

  labels:
    name: Area labels
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@v6
        with:
          sync-labels: false
