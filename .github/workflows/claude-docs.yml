# Label a pull request `docs-sync` and Claude brings the documentation in line with the code,
# following .agents/agents/docs-writer.md, and pushes a commit to the PR branch.
# Requires the ANTHROPIC_API_KEY secret. Same-repository branches only (no forks).
name: Claude docs sync

on:
  pull_request:
    types: [labeled]

permissions: {}

jobs:
  docs:
    if: github.event.label.name == 'docs-sync' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The action replaces checkout credentials with its own token before it pushes;
          # none stays on disk while the project builds from the pull request branch.
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: "3.13"
      - run: uv sync --locked --all-extras --group dev --group docs
      - uses: anthropics/claude-code-action@61a9c274fa7110a66dfafc1bbbced03833eb25fe # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            You are working on PR #${{ github.event.pull_request.number }} in ${{ github.repository }}.
            Act as the docs-writer defined in .agents/agents/docs-writer.md.
            1. Run `python3 scripts/docs_sync.py impact --base origin/${{ github.base_ref }}` and
               `uv run python scripts/docs_sync.py coverage`; close every gap they report.
            2. Run `uv run just generate` and `uv run just docs`.
            3. Commit only documentation and generated files with a Conventional Commit
               message `docs(<scope>): ...`, signed off, and push to the PR branch.
            Follow the house style in AGENTS.md: no icons or emoji.
          claude_args: >-
            --max-turns 40
            --allowedTools "Read,Write,Edit,Grep,Glob,Bash(uv run:*),Bash(python3 scripts/docs_sync.py:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(git diff:*),Bash(git status:*)"
