# Terminology for the Italian edition. Translators (human or agent) must use these terms.
# Where Italian practice keeps the English term, the English term is used, optionally with
# the Italian explanation at first use.
# Rule: use only terms in use in Italian professional practice; never invent Italian terms or
# verbs from English roots. English terms are kept when practice uses them.
terms:
  valuation: valutazione
  enterprise value: enterprise value (valore del capitale operativo)
  equity value: equity value (valore del capitale proprio)
  free cash flow to the firm (FCFF): flusso di cassa operativo disponibile (FCFF)
  free cash flow to equity (FCFE): flusso di cassa disponibile per gli azionisti (FCFE)
  discount rate: tasso di attualizzazione
  discount factor: fattore di sconto
  present value: valore attuale
  net present value (NPV): valore attuale netto (VAN, NPV)
  internal rate of return (IRR): tasso interno di rendimento (TIR, IRR)
  terminal value: valore terminale
  terminal growth: tasso di crescita di lungo periodo
  net debt: posizione finanziaria netta (PFN)
  non-operating assets: attività non operative (surplus asset)
  cost of capital: costo del capitale
  weighted average cost of capital (WACC): costo medio ponderato del capitale (WACC)
  end of period: fine periodo
  mid period: metà periodo
  golden case: caso di riferimento (golden case)
  audit trail: tracciabilità del calcolo (audit trail)
  convention: convenzione
  financial statements: bilancio d'esercizio
  business plan: business plan
  spec: specifica
  day count: convenzione di calcolo dei giorni
  year fraction: frazione d'anno
  valuation date: data di valutazione
  compounding: capitalizzazione
  continuous compounding: capitalizzazione continua
  effective annual rate: tasso annuo effettivo
  nominal rate: tasso nominale
  real rate: tasso reale
  annuity: rendita
  ordinary annuity: rendita posticipata
  annuity due: rendita anticipata
  growing annuity: rendita crescente
  perpetuity: rendita perpetua
  modified internal rate of return (MIRR): tasso interno di rendimento modificato (TIRM, MIRR)
  finance rate: tasso di finanziamento
  reinvestment rate: tasso di reinvestimento
  forward period rate: tasso forward di periodo
  solver: algoritmo
  grid scan: scansione su griglia
  bisection: bisezione
  accuracy: precisione
  cost of equity: costo del capitale proprio
  cost of debt: costo del debito
  pre-tax: prima delle imposte
  after-tax: dopo le imposte
  capital asset pricing model (CAPM): capital asset pricing model (CAPM)
  risk-free rate: tasso privo di rischio
  levered beta: beta levered (beta del capitale proprio)
  unlevered beta: beta unlevered (beta dell'attivo, asset beta)
  debt beta: beta del debito
  relever: "relevering (sostantivo: il relevering del beta, applicare il relevering)"
  unlever: "unlevering (sostantivo: l'unlevering dei beta delle comparabili)"
  equity risk premium: premio per il rischio di mercato
  country risk premium: premio per il rischio paese
  size premium: premio dimensionale
  specific risk premium: premio per il rischio specifico
  credit spread: spread creditizio
  tax shield: scudo fiscale
  tax rate: aliquota fiscale
  debt-to-equity ratio (D/E): rapporto tra debito e capitale proprio (D/E)
  debt weight: peso del debito
  target capital structure: struttura finanziaria obiettivo
  comparable companies (peers): società comparabili (peers)
  goal seek: ricerca obiettivo (goal seek alla prima occorrenza; nome della funzione in Excel)
  analysis method: metodo di analisi
  inner method: metodo interno
  target (goal seek): valore obiettivo
  bracket (root finding): intervallo di ricerca
  tolerance: tolleranza
  residual: residuo
  Brent's method: metodo di Brent
  secant method: metodo delle secanti
  inverse quadratic interpolation: interpolazione quadratica inversa
  sensitivity table: tabella di sensitività
  one-way table: tabella a una variabile
  two-way table: tabella a due variabili
  scenario analysis: analisi di scenario
  base case: caso base
  delta (scenario analysis): scostamento
  relative delta: scostamento relativo
  swing (tornado): escursione
  tornado chart: grafico a tornado
  currency units: unità monetarie
  loan: finanziamento
  instalment: rata
  interest portion: quota interessi
  principal portion: quota capitale
  outstanding balance: debito residuo
  amortisation schedule: piano di ammortamento
  amortisation type: tipo di ammortamento
  French amortisation (constant instalment): ammortamento alla francese (a rata costante)
  fixed amortisation schedule (constant principal portion): ammortamento all'italiana (a quota capitale costante)
  bullet (amortisation type): bullet (rimborso integrale del capitale con l'ultima rata)
  principal grace period: preammortamento
  balloon amount: balloon (capitale rimborsato alla scadenza oltre la rata)
  borrowing rate: tasso annuo nominale (TAN)
  annual percentage rate of charge (APRC): tasso annuo effettivo globale (TAEG)
  payment frequency: periodicità della rata
  payment in arrears: rata posticipata
  payment in advance: rata anticipata
  number of instalments: numero delle rate
  future value: valore futuro (montante)
keep_in_english:
  - Fairmark
  - explain
  - input hash
  - MCP
  - function calling
  - CLI
  - pull request
  - JSON Pointer
