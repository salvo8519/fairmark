# Italian titles of the registered methods, keyed by method id, for the Italian README table
# (generated by scripts/gen_reference.py). The English title comes from the engine registry.
# Every registered method needs one entry and no other id may appear: gen_reference.py fails
# otherwise. Keep each title short like the English one and follow i18n/glossary.yaml; where
# Italian practice keeps an English term (FCFF, WACC, XNPV, H-model) keep it in English.
dates.year_fraction: Frazione d'anno (convenzione di calcolo dei giorni)
dates.schedule: Schedule dei periodi
series.project: Proiezione di una serie di valori su una timeline
rates.convert: Conversione di un tasso tra convenzioni di capitalizzazione
rates.real_nominal: Tassi reali e nominali (Fisher)
tvm.npv: Valore attuale netto (VAN, NPV)
tvm.present_value: Valore attuale con un tasso costante o variabile per periodo
tvm.xnpv: Valore attuale netto di flussi datati (XNPV)
tvm.irr: Tasso interno di rendimento (TIR, IRR)
tvm.xirr: Tasso interno di rendimento di flussi datati (XIRR)
tvm.mirr: Tasso interno di rendimento modificato (TIRM, MIRR)
tvm.annuity: Rendita (costante o crescente, posticipata o anticipata)
tvm.perpetuity: Rendita perpetua (costante o crescente)
tvm.future_value: Valore futuro (montante) di un importo attuale e di pagamenti costanti
loans.instalment: Rata di un finanziamento (rata costante, balloon facoltativo)
loans.number_of_instalments: Numero delle rate di un finanziamento
loans.amortisation_schedule: Piano di ammortamento (alla francese, all'italiana, bullet)
coc.cost_of_equity: Costo del capitale proprio (CAPM con premi espliciti)
coc.beta_relever: Unlevering e relevering del beta
coc.beta_peers: Beta da società comparabili
coc.cost_of_debt: Costo del debito
coc.wacc: Costo medio ponderato del capitale (WACC)
tv.gordon: Valore terminale, crescita costante (Gordon)
tv.value_driver: Valore terminale, value driver (crescita dal reinvestimento)
tv.h_model: Valore terminale, H-model (crescita in calo)
tv.exit_multiple: Valore terminale, multiplo di uscita (exit multiple)
tv.limited_horizon: Valore terminale, orizzonte finito
tv.normalised_income: Valore terminale, reddito normalizzato capitalizzato
tv.liquidation: Valore terminale, valore di liquidazione
tv.compare: Valore terminale, confronto tra tecniche
dcf.fcff: DCF, flusso di cassa operativo disponibile (FCFF)
dcf.fcfe: DCF, flusso di cassa disponibile per gli azionisti (FCFE)
dcf.free_cash_flows: Flussi di cassa disponibili (FCFF e FCFE) da EBIT, imposte, investimenti e capitale circolante
ratios.profitability: Indici di bilancio, redditività
ratios.capital_structure: Indici di bilancio, struttura finanziaria
ratios.liquidity: Indici di bilancio, liquidità
ratios.working_capital: Indici di bilancio, capitale circolante
ratios.debt_service: Indici di bilancio, servizio del debito
ratios.covenants: Indici di bilancio, verifica dei covenant
analysis.goal_seek: Ricerca obiettivo (goal seek)
analysis.sensitivity: Tabella di sensitività
analysis.scenarios: Analisi di scenario
analysis.tornado: Tornado
