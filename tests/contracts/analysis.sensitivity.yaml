# Contract cases for analysis.sensitivity: extreme inputs must return a result or a typed error,
# never a panic (MAX and MIN stand for the largest and smallest decimals);
# conventions must appear in explain.conventions.
method: analysis.sensitivity
extreme_inputs:
- method: tvm.npv
  base_input: {rate: '0.1', cash_flows: ['-100', '60', '60']}
  output: /npv
  rows: {variable: /rate, values: [MIN, '-1', '0', MAX]}
  columns: {variable: /cash_flows/0, values: [MIN, MAX]}
- method: dcf.fcff
  base_input: {stages: [{periods: 2, projection: given, flows: [MAX, MAX]}], cash_flow_terms: nominal, discount_rate_terms: nominal, wacc: '0.1', timing: end_of_period, terminal: {tv.gordon: {growth: '0.02', first_flow: last_flow_grown}}, net_financial_position: {gross_debt: MIN, cash: '0'}}
  output: /equity_value
  rows: {variable: /wacc, values: ['0.0000000000000000000000000001', MAX]}
conventions:
- input:
    method: tvm.npv
    base_input: {rate: '0.1', cash_flows: ['-100', '60', '60']}
    output: /npv
    rows: {variable: /rate, values: ['0.05', '0.1']}
  expect:
  - inner method tvm.npv version 2
  - each cell reports /npv
  - row-major
  - holds its error code and message and the table goes on
  - the variables are written into the inner input as decimal strings
