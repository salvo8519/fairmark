# Contract cases for tv.compare: extreme inputs must return a result or a typed error,
# never a panic (MAX and MIN stand for the largest and smallest decimals);
# conventions must appear in explain.conventions.
method: tv.compare
extreme_inputs:
- rate: MAX
  basis: equity
  growth_cap: MIN
  techniques:
  - tv.gordon:
      growth: MIN
      next_flow: MAX
  - tv.exit_multiple:
      multiple: MAX
      metric: earnings
      metric_value: MAX
      next_flow: MIN
  - tv.limited_horizon:
      flow: MAX
      periods: 10000
conventions:
- input:
    rate: '0.10'
    basis: enterprise
    techniques:
    - tv.gordon:
        growth: '0.02'
        next_flow: '100'
    - tv.normalised_income:
        income: '95'
        capitalisation_rate: '0.11'
        basis: enterprise
  expect:
  - 'basis: enterprise'
  - 'shared rate 0.10'
  - '[1] tv.gordon: flow at N + 1 given'
