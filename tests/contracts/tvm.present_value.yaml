# Contract cases for tvm.present_value: extreme inputs must return a result or a typed error,
# never a panic (MAX and MIN stand for the largest and smallest decimals);
# conventions must appear in explain.conventions.
method: tvm.present_value
extreme_inputs:
- cash_flows:
  - MAX
  rate: MAX
  timing: mid_period
conventions:
- input:
    cash_flows:
    - '1'
    rate: '0.1'
    timing: mid_period
  expect:
  - mid period
  - one rate for every period
