# Contract cases for dcf.fcff: extreme inputs must return a result or a typed error,
# never a panic (MAX and MIN stand for the largest and smallest decimals);
# conventions must appear in explain.conventions.
method: dcf.fcff
extreme_inputs:
- stages: [{periods: 2, projection: given, flows: [MAX, MAX]}]
  cash_flow_terms: nominal
  discount_rate_terms: nominal
  wacc: MAX
  timing: end_of_period
  terminal: {tv.gordon: {growth: '0.01', first_flow: last_flow_grown}}
- stages:
  - {periods: 1, projection: given, flows: [MAX]}
  - {periods: 3, projection: constant_growth, growth: MAX}
  - {periods: 2, projection: linear_decline, from_growth: MIN, to_growth: MAX}
  cash_flow_terms: real
  discount_rate_terms: real
  wacc_per_period: [MIN, '0.1', MAX, '-0.99', '0', MAX]
  terminal_wacc: MAX
  timing: mid_period
  terminal_discount_time: mid_period
  terminal: {tv.gordon: {growth: '0.5', first_flow: normalised_next_flow, normalised_next_flow: MIN, growth_cap: MIN}}
  net_financial_position: {gross_debt: MAX, cash: MIN, other_items: [{name: x, amount: MAX}]}
  non_operating_assets: [{label: Land, value: MAX}]
- stages: [{periods: 10000, projection: constant_growth, growth: '0.5'}]
  base_flow: MAX
  cash_flow_terms: nominal
  discount_rate_terms: nominal
  wacc: '0.0000000000000000000000000001'
  timing: mid_period
  terminal_discount_time: horizon
  terminal: {tv.gordon: {growth: '0', first_flow: last_flow_grown}}
- stages: [{periods: 4294967295, projection: constant_growth, growth: '0.01'}]
  base_flow: '1'
  cash_flow_terms: nominal
  discount_rate_terms: nominal
  wacc: '0.1'
  timing: end_of_period
  terminal: {tv.gordon: {growth: '0', first_flow: last_flow_grown}}
- stages: [{periods: 2, projection: given, flows: [MAX, MIN]}]
  cash_flow_terms: nominal
  discount_rate_terms: nominal
  wacc: MAX
  timing: mid_period
  terminal_discount_time: mid_period
  terminal: {tv.h_model: {short_term_growth: MAX, long_term_growth: '0.01', half_life: MAX, first_flow: last_flow_grown, growth_cap: MIN}}
- stages: [{periods: 1, projection: given, flows: [MAX]}]
  cash_flow_terms: nominal
  discount_rate_terms: nominal
  wacc: MAX
  timing: end_of_period
  terminal: {tv.value_driver: {nopat_next: MAX, growth: MIN, ronic: '0.0000000000000000000000000001'}}
- stages: [{periods: 1, projection: given, flows: [MIN]}]
  cash_flow_terms: nominal
  discount_rate_terms: nominal
  wacc: '-0.99'
  timing: mid_period
  terminal_discount_time: mid_period
  terminal: {tv.exit_multiple: {multiple: MAX, metric: revenue, metric_value: MAX, next_flow: MIN, growth_cap: MAX}}
- stages: [{periods: 3, projection: given, flows: ['1', '2', '3']}]
  cash_flow_terms: nominal
  discount_rate_terms: nominal
  wacc: '-0.99'
  timing: end_of_period
  terminal: {tv.limited_horizon: {flow: MAX, periods: 10000, growth: MAX, residual_value: MAX}}
- stages: [{periods: 1, projection: given, flows: ['1']}]
  cash_flow_terms: nominal
  discount_rate_terms: nominal
  wacc: '0.1'
  timing: end_of_period
  terminal: {tv.liquidation: {assets: [{label: a, value: MAX}, {label: b, value: MAX}], liabilities: [{label: c, value: MAX}], liquidation_costs: [], tax_on_gains: MAX, basis: enterprise}}
- stages: [{periods: 1, projection: given, flows: [MAX]}]
  cash_flow_terms: nominal
  discount_rate_terms: nominal
  wacc: '0.0000000000000000000000000001'
  timing: mid_period
  terminal_discount_time: horizon
  terminal: {tv.normalised_income: {income: MAX, basis: enterprise, growth: MIN, growth_cap: MAX}}
- stages: [{periods: 2, projection: given, flows: ['100', '110']}]
  cash_flow_terms: real
  discount_rate_terms: nominal
  wacc: '0.1'
  inflation: MAX
  timing: end_of_period
  terminal: {tv.gordon: {growth: '0.01', first_flow: last_flow_grown}}
- stages: [{periods: 1, projection: given, flows: [MAX]}]
  cash_flow_terms: nominal
  discount_rate_terms: nominal
  wacc: '0.10'
  timing: end_of_period
  terminal: {tv.gordon: {growth: '0.01', first_flow: last_flow_grown}}
  net_financial_position: {gross_debt: MAX, cash: MIN}
  non_operating_assets: [{label: a, value: MAX}]
  debt_like_items: [{label: b, value: MAX, measurement_basis: book value}, {label: c, value: MAX, measurement_basis: book value}]
  non_controlling_interests: [{label: d, value: MAX, measurement_basis: fair value}]
conventions:
- input:
    stages: [{periods: 3, projection: given, flows: ['100', '110', '120']}]
    cash_flow_terms: nominal
    discount_rate_terms: nominal
    wacc: '0.10'
    timing: end_of_period
    terminal: {tv.gordon: {growth: '0.02', first_flow: last_flow_grown}}
    net_financial_position: {gross_debt: '200', cash: '0'}
  expect:
  - 'basis: enterprise'
  - 'terms: cash flows and growth rates nominal, discount rates nominal; same terms, no conversion'
  - 'stage 1: periods 1 to 3, given flows'
  - 'discount rate: one rate, 0.10, for every period and for the terminal value'
  - 'timing: end of period'
  - 'terminal technique: tv.gordon version 1'
  - 'first terminal flow: the last explicit flow grown'
  - terminal value discounted at the horizon, t = N
  - 'non-operating assets: none given'
  - net financial position = gross debt − cash + other items
- input:
    stages:
    - {periods: 2, projection: constant_growth, growth: '0.08'}
    - {periods: 3, projection: linear_decline, from_growth: '0.08', to_growth: '0.02'}
    base_flow: '50'
    cash_flow_terms: real
    discount_rate_terms: real
    wacc_per_period: ['0.07', '0.07', '0.065', '0.06', '0.06']
    terminal_wacc: '0.06'
    timing: mid_period
    terminal_discount_time: horizon
    terminal: {tv.gordon: {growth: '0.02', first_flow: normalised_next_flow, normalised_next_flow: '70'}}
  expect:
  - 'base flow CF_0 = 50'
  - 'stage 1: periods 1 to 2, constant growth 0.08'
  - 'stage 2: periods 3 to 5, growth declining in linear increments from 0.08 to 0.02'
  - 'terms: cash flows and growth rates real, discount rates real'
  - 'discount rate: one rate per period; terminal rate 0.06 given separately'
  - 'timing: mid period'
  - 'first terminal flow: normalised flow at N + 1'
  - 'terminal discounting time: horizon, t = N'
  - 'net financial position: none given'
- input:
    stages: [{periods: 3, projection: given, flows: ['100', '110', '120']}]
    cash_flow_terms: nominal
    discount_rate_terms: nominal
    wacc: '0.10'
    timing: mid_period
    terminal_discount_time: mid_period
    terminal: {tv.exit_multiple: {multiple: '8', metric: ebitda, metric_value: '180'}}
  expect:
  - 'terminal technique: tv.exit_multiple version 1 on the enterprise basis'
  - 'no next flow given: the terminal rate is not used'
  - 'terminal value from the metric at N; no terminal flow is projected'
  - 'terminal discounting time: mid_period, t = N − 0.5'
  - 'warning: tv.exit_multiple is a price at the horizon N'
- input:
    stages: [{periods: 2, projection: given, flows: ['100', '110']}]
    cash_flow_terms: nominal
    discount_rate_terms: nominal
    wacc: '0.10'
    timing: end_of_period
    terminal: {tv.liquidation: {assets: [{label: Plant, value: '500'}], liabilities: [], liquidation_costs: [], tax_on_gains: '0', basis: enterprise}}
  expect:
  - 'terminal technique: tv.liquidation version 1 on the enterprise basis'
  - 'the technique takes no discount rate'
  - 'terminal value (tv.liquidation v1): basis: enterprise (declared)'
- input:
    stages: [{periods: 3, projection: given, flows: ['100', '104', '108']}]
    cash_flow_terms: real
    discount_rate_terms: nominal
    wacc: '0.10'
    inflation: '0.02'
    timing: end_of_period
    terminal: {tv.gordon: {growth: '0.01', first_flow: last_flow_grown}}
  expect:
  - 'expected inflation: one rate, 0.02, for every period and for the terminal phase'
  - 'terms: cash flows and growth rates real, discount rates nominal; every discount rate, the terminal rate included, converted to real terms'
  - exact Fisher relation (1 + nominal) = (1 + real) × (1 + inflation) (rates.real_nominal v1)
  - cash flows and growth rates are never converted
  - 'discount rate: one rate, 0.10, for every period and for the terminal value (as given, in nominal terms)'
  - 'perpetual growth of the terminal value (tv.gordon): 0.01 in real terms, (1 + 0.01) × (1 + 0.02) − 1 = 0.0302 in nominal terms'
- input:
    stages: [{periods: 3, projection: given, flows: ['100', '110', '120']}]
    cash_flow_terms: nominal
    discount_rate_terms: nominal
    wacc: '0.10'
    timing: end_of_period
    terminal: {tv.gordon: {growth: '0.02', first_flow: last_flow_grown}}
    net_financial_position: {gross_debt: '1100', cash: '50'}
    debt_like_items: [{label: Unfunded pension obligation, value: '300', measurement_basis: book value}]
    non_controlling_interests: [{label: 40% of Subsidiary B, value: '150', measurement_basis: fair value}]
  expect:
  - bridge items measured at the valuation date, as given
  - 'bridge signs: non-operating assets added to the value of operations; net financial position (positive for net debt), debt-like items and non-controlling interests subtracted from enterprise value; every debt-like item and non-controlling interest is zero or more'
  - 'non-operating assets: none given'
  - 'debt-like item ''Unfunded pension obligation'': measurement basis stated by the analyst: book value'
  - 'non-controlling interest ''40% of Subsidiary B'': measurement basis stated by the analyst: fair value'
  - 'warning: the equity value is negative'
