# Contract cases for statements.reorganise: extreme inputs must return a result or a typed
# error, never a panic (MAX and MIN stand for the largest and smallest decimals);
# conventions must appear in explain.conventions.
method: statements.reorganise
extreme_inputs:
- years:
  - statutory:
      balance_sheet:
        subscribed_capital_unpaid: '0'
        intangible_assets: {total: MAX}
        tangible_assets: {total: MAX}
        financial_fixed_assets: MAX
        inventories: MAX
        receivables: {total: MAX, beyond_one_year: MAX}
        current_financial_assets: MAX
        cash: MAX
        prepayments_and_accrued_income: {total: MAX}
        equity: {total: MIN}
        provisions: {total: MAX}
        employee_severance_indemnity: {total: MAX}
        payables:
          total: MAX
          beyond_one_year: MAX
          financial_debt: {total: MAX, beyond_one_year: MAX}
          shareholder_loans: {total: MAX, beyond_one_year: MAX}
        accruals_and_deferred_income: {total: MAX}
  treatments: {financial_fixed_assets: operating, shareholder_loans: financial_debt}
- years:
  - statutory:
      balance_sheet:
        cash: MAX
        current_financial_assets: MAX
        payables:
          total: '0'
          financial_debt: {total: '0', beyond_one_year: '0'}
          shareholder_loans: {total: '0', beyond_one_year: '0'}
        financial_fixed_assets: MAX
  treatments: {financial_fixed_assets: financial_asset}
  adjustments:
  - {kind: operating_cash, label: Minimum cash, reason: Operations, amounts: [MAX]}
- years:
  - reclassified:
      balance_sheet:
        operating_fixed_assets: MAX
        operating_working_capital: {trade_receivables: MAX, inventories: MAX, other_operating_assets: MAX, trade_payables: '0', other_operating_liabilities: '0'}
        operating_provisions: '0'
        non_operating_assets: [{label: a, value: MAX}, {label: b, value: MAX}]
        equity: MIN
        quasi_equity_items: []
        debt_like_items: [{label: c, value: MAX, measurement_basis: book_value}]
        net_financial_position: {position: {gross_debt: MAX, cash: '0', other_items: [{name: d, amount: MAX}]}}
- years:
  - statutory:
      income_statement:
        revenue: MAX
        change_in_product_inventories: MAX
        own_work_capitalised: MAX
        other_revenue_and_income: MAX
        value_of_production: MIN
        depreciation_and_write_downs: {depreciation_and_amortisation: MAX, write_downs_of_fixed_assets: MAX, write_downs_of_receivables: MAX}
        profit_before_tax: MIN
        income_taxes: MAX
        profit_or_loss_for_the_year: MIN
- years:
  - statutory:
      income_statement:
        revenue: MAX
        change_in_product_inventories: MIN
        own_work_capitalised: '0'
        other_revenue_and_income: MAX
        purchases: MAX
        services: MAX
        use_of_third_party_assets: MAX
        personnel_costs: MAX
        depreciation_and_write_downs: {value_adjustments_of_fixed_assets: MAX, write_downs_of_receivables: MAX}
        change_in_raw_material_inventories: MIN
        provisions_for_risks: MAX
        other_provisions: MAX
        other_operating_expenses: MAX
        income_from_equity_investments: MAX
        other_financial_income: MAX
        interest_and_other_financial_charges: MAX
        exchange_gains_and_losses: MIN
        revaluations_of_financial_assets: MAX
        write_downs_of_financial_assets: MAX
        income_taxes: MIN
  adjustments:
  - {kind: investing, label: Rent, reason: Investment property, aggregate: other_revenue_and_income, amounts: [MAX]}
  - {kind: non_recurring, label: Gain, reason: Disposal, aggregate: revenue, amounts: [MAX]}
  - kind: lease
    label: Head office
    reason: Financial method
    amounts: [{asset: MAX, liability: MAX, liability_current: '0', prepayment: '0', payments: MAX, depreciation: MAX, interest: MAX}]
- years:
  - reclassified:
      income_statement:
        value_added: MAX
        personnel_costs: '0.0000000000000000000000000001'
        operating_profit: MAX
        investing_result: MAX
        non_recurring_result: MIN
        financing_result: MIN
        income_taxes: MAX
conventions:
- input:
    years:
    - label: '2024'
      statutory:
        layout: abridged
        balance_sheet:
          subscribed_capital_unpaid: '0'
          financial_fixed_assets: '0'
          cash: '100'
          provisions: {total: '40'}
          receivables: {total: '300', beyond_one_year: '0'}
  expect:
  - 'default: `/years/0/statutory/balance_sheet/cash` assigned to'
  - 'Appendix A.1, C.IV: all cash in the net financial position (Decision 11)'
  - 'year 2024: statutory form'
  - 'year 2024: no date given: the order of `years` is taken as oldest first'
  - 'layout `abridged` echoed; no number depends on it'
  - 'year 2024: financial fixed assets (B.III) are zero: no treatment is needed'
  - 'missing inputs are never taken as zero'
  - 'checks are exact, with no tolerance'
  - 'net financial position = gross debt − cash + other items, positive for net debt'
  - 'current and non-current: receivables (C.II) and payables (D) split by their statutory amounts beyond one year, read as twelve months'
  - 'year 2024: provisions (B) read as non-current: the part beyond one year is not given'
- input:
    years:
    - label: '2024'
      statutory:
        income_statement:
          other_revenue_and_income: '10'
          depreciation_and_write_downs: {value_adjustments_of_fixed_assets: '100', write_downs_of_receivables: '5'}
    adjustments:
    - kind: lease
      label: Head office
      reason: Financial method
      amounts: [{asset: '10', liability: '8', liability_current: '2', prepayment: '0', payments: '3', depreciation: '2', interest: '1'}]
    treatments: {write_downs_of_fixed_assets: investing}
  expect:
  - 'income statement by nature reorganised into the layers of Appendix B.2 (R16)'
  - 'ebitda_definition: EBITDA (margine operativo lordo, MOL) = value added − personnel costs (B9)'
  - 'A5 and B14 are core by default (Decision 7, R18)'
  - 'D18 and D19 in the investing result; B10 c in the investing result (treatment `investing`); B10 d below EBITDA in other_charges_below_ebitda (treatment `operating`, the default)'
  - 'default: `/treatments/write_downs_of_receivables` not given, set to'
  - 'C15 and C16 in the investing result; C17 and C17-bis in the financing result'
  - 'income taxes: item 20 as given; no IRES, IRAP, deferred taxes or NOPAT are computed'
  - 'cost_of_sales is not returned (Decision 13)'
  - 'operating_profit feeds `ebit` of dcf.free_cash_flows'
  - 'leases restated by the financial method (R21, Decision 9'
  - 'year 2024: B10 a to c given as one amount without its B10 c part: read as depreciation and amortisation'
  - 'default: `/years/0/statutory/income_statement/other_revenue_and_income` assigned to'
  - 'default: `/years/0/statutory/income_statement/depreciation_and_write_downs/write_downs_of_receivables` assigned to'
- input:
    years:
    - label: '2024'
      reclassified:
        balance_sheet: {equity: '100'}
    treatments: {financial_fixed_assets: operating}
  expect:
  - 'year 2024: reclassified form'
  - 'treatments and adjustments do not apply to the reclassified entries: 2024'
