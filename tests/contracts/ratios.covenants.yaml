    covenants:
    - name: net leverage
      test_date: '2026-12-31'
      numerator: {definition: consolidated net financial debt at the test date, amount: '3504'}
      denominator: {definition: consolidated EBITDA for the 12 months ending on the test date, amount: '1000'}
