    covenants:
    - name: extreme leverage
      test_date: '2026-12-31'
      numerator: {definition: consolidated net financial debt at the test date, amount: '79228162514264337593543950335'}
      denominator: {definition: consolidated EBITDA for the 12 months ending on the test date, amount: '0.0000000000000000000000000001'}
