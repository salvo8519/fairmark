method: ratios.working_capital
description: 'R7, R12: the minimal input for days sales outstanding'
source: scripts/reference_ratios_partial.py (Python decimal, 50 digits, local context), written from the
  formulas and the computability tables of specs/0007-ratios-covenants/spec.md (amendment of 2026-11-09).
  DSO 1200 × 365 / 5000 = 87.6.
input:
  balances: closing
  day_basis: '365'
  income_statement:
    revenue: '5000'
  closing:
    trade_receivables: '1200'
expect:
  /days_sales_outstanding/value: '87.6'
  /days_inventory_outstanding/value: 'null'
  /days_payable_outstanding/value: 'null'
  /cash_conversion_cycle/value: 'null'
tolerance: '0.00000000000000000001'
expect_counts:
  not_computed: '3'
expect_not_computed:
  /value/cash_conversion_cycle:
    /missing_any_of/0/0: /closing/inventories
    /missing_any_of/0/1: /closing/trade_payables
    /missing_any_of/0/2: /income_statement/cost_of_sales
    /missing_any_of/0/3: /income_statement/purchases
  /value/days_inventory_outstanding:
    /missing_any_of/0/0: /closing/inventories
    /missing_any_of/0/1: /income_statement/cost_of_sales
  /value/days_payable_outstanding:
    /missing_any_of/0/0: /closing/trade_payables
    /missing_any_of/0/1: /income_statement/purchases
