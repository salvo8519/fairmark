method: tvm.npv
description: 'ADR 0014 G5 (review of #279): two misspelt fields are both reported as unknown fields, each
  with the closest accepted field in fix, and the two fields they stand for as missing'
source: 'ADR 0014 G5 as amended (every reading error reported, each as serde reports it alone, in the
  canonical order of the maintainer decision of 2026-11-17: by pointer, then code, then message;
  expected = the accepted fields, fix naming the closest field within an edit distance of 2);
  the accepted fields rate and cash_flows are those of schemas/tvm.npv/v1.json.
  Written from the ADR and the schema, not from the engine''s output.'
input:
  rat: '0.1'
  cashflows:
  - '-100'
  - '60'
  - '60'
expect_error: FM-E001
expect_error_report:
  /pointer: /cash_flows
expect_counts:
  errors: '4'
expect_errors:
  FM-E001 /cash_flows: {}
  FM-E001 /cashflows:
    /fix: rename `cashflows` to `cash_flows`
    /reason: unknown_field
  FM-E001 /rat:
    /expected/0: rate
    /expected/1: cash_flows
    /fix: rename `rat` to `rate`
    /reason: unknown_field
  FM-E001 /rate:
    /reason: missing
