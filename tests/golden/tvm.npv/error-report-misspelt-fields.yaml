method: tvm.npv
description: 'ADR 0014 G5 (review of #279): two misspelt fields are both reported as unknown fields, each
  with the closest accepted field in fix, and the two fields they stand for as missing'
source: 'ADR 0014 G5 as amended (every reading error reported, each as serde reports it alone, in the
  canonical order of the maintainer decision of 2026-11-17: by pointer, then code, then message; expected = the accepted fields, fix naming the closest field
  within an edit distance of 2); the accepted fields rate and cash_flows are those of schemas/tvm.npv/v1.json.
  Written from the ADR and the schema, not from the engine''s output.'
input:
  rat: '0.1'
  cashflows:
  - '-100'
  - '60'
  - '60'
expect_error: FM-E001
expect_error_report:
  /pointer: /cash_flows
  /errors/0/pointer: /cash_flows
  /errors/1/pointer: /cashflows
  /errors/1/reason: unknown_field
  /errors/1/fix: rename `cashflows` to `cash_flows`
  /errors/2/pointer: /rat
  /errors/2/reason: unknown_field
  /errors/2/expected/0: rate
  /errors/2/expected/1: cash_flows
  /errors/2/fix: rename `rat` to `rate`
  /errors/3/pointer: /rate
  /errors/3/reason: missing
expect_length:
  /errors: '4'
