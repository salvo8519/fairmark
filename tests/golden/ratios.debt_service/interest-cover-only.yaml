method: ratios.debt_service
description: 'R7, R9, R12: the minimal input for the EBIT interest cover'
source: scripts/reference_ratios_partial.py (Python decimal, 50 digits, local context), written from the
  formulas and the computability tables of specs/0007-ratios-covenants/spec.md (amendment of 2026-11-09).
  EBIT cover 500 / 100 = 5.
input:
  balances: closing
  interest_definition: gross interest expense
  income_statement:
    ebit: '500'
    interest: '100'
expect:
  /net_financial_position: 'null'
  /interest_cover_ebit/value: '5'
  /interest_cover_ebitda/value: 'null'
  /nfp_to_ebitda/value: 'null'
  /pv_cfads: 'null'
  /llcr/value: 'null'
  /not_computed/0/output: '/net_financial_position'
  /not_computed/0/missing/0: '/closing/net_financial_position/cash'
  /not_computed/0/missing/1: '/closing/net_financial_position/gross_debt'
  /not_computed/1/output: '/interest_cover_ebitda'
  /not_computed/1/missing/0: '/ebitda_definition'
  /not_computed/1/missing/1: '/income_statement/ebitda'
  /not_computed/2/output: '/nfp_to_ebitda'
  /not_computed/2/missing/0: '/closing/net_financial_position/cash'
  /not_computed/2/missing/1: '/closing/net_financial_position/gross_debt'
  /not_computed/2/missing/2: '/ebitda_definition'
  /not_computed/2/missing/3: '/income_statement/ebitda'
  /not_computed/3/output: '/pv_cfads'
  /not_computed/3/missing/0: '/debt_schedule'
  /not_computed/4/output: '/llcr'
  /not_computed/4/missing/0: '/debt_schedule'
expect_length:
  /not_computed: '5'
tolerance: '0.00000000000000000001'
