method: ratios.debt_service
description: 'R7, R9, R12: the minimal input for the EBIT interest cover'
source: scripts/reference_ratios_partial.py (Python decimal, 50 digits, local context), written from the
  formulas and the computability tables of specs/0007-ratios-covenants/spec.md (amendment of 2026-11-09).
  EBIT cover 500 / 100 = 5.
input:
  balances: closing
  interest_definition: gross interest expense
  income_statement:
    ebit: '500'
    interest: '100'
expect:
  /net_financial_position: 'null'
  /interest_cover_ebit/value: '5'
  /interest_cover_ebitda/value: 'null'
  /nfp_to_ebitda/value: 'null'
  /pv_cfads: 'null'
  /llcr/value: 'null'
expect_diagnostics_length:
  /not_computed: '5'
expect_diagnostics:
  /not_computed/2/pointer: /value/net_financial_position
  /not_computed/2/missing_any_of/0/0: '/closing/net_financial_position/cash'
  /not_computed/2/missing_any_of/0/1: '/closing/net_financial_position/gross_debt'
  /not_computed/0/pointer: /value/interest_cover_ebitda
  /not_computed/0/missing_any_of/0/0: '/ebitda_definition'
  /not_computed/0/missing_any_of/0/1: '/income_statement/ebitda'
  /not_computed/3/pointer: /value/nfp_to_ebitda
  /not_computed/3/missing_any_of/0/0: '/closing/net_financial_position/cash'
  /not_computed/3/missing_any_of/0/1: '/closing/net_financial_position/gross_debt'
  /not_computed/3/missing_any_of/0/2: '/ebitda_definition'
  /not_computed/3/missing_any_of/0/3: '/income_statement/ebitda'
  /not_computed/4/pointer: /value/pv_cfads
  /not_computed/4/missing_any_of/0/0: '/debt_schedule'
  /not_computed/1/pointer: /value/llcr
  /not_computed/1/missing_any_of/0/0: '/debt_schedule'
tolerance: '0.00000000000000000001'
