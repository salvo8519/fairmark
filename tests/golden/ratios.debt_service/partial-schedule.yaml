method: ratios.debt_service
description: 'R7, R9: interest without its definition and one period without debt service'
source: scripts/reference_ratios_partial.py (Python decimal, 50 digits, local context), written from the
  formulas and the computability tables of specs/0007-ratios-covenants/spec.md (amendment of 2026-11-09).
  Interest covers lack `/interest_definition`; DSCR 250 / 230 and 270 / 240; PV of CFADS at 6% of 250,
  260, 270; LLCR = PV / 1000.
input:
  balances: closing
  ebitda_definition: reported EBITDA, no adjustments
  income_statement:
    ebitda: '800'
    ebit: '500'
    interest: '100'
  closing:
    net_financial_position:
      gross_debt: '2200'
      cash: '300'
  debt_schedule:
    discount_rate: '0.06'
    debt_outstanding: '1000'
    periods:
    - cfads: '250'
      debt_service: '230'
    - cfads: '260'
    - cfads: '270'
      debt_service: '240'
expect:
  /net_financial_position: '1900'
  /interest_cover_ebit/value: 'null'
  /interest_cover_ebitda/value: 'null'
  /nfp_to_ebitda/value: '2.375'
  /dscr/0/value: '1.0869565217391304347826086956521739130434782608696'
  /dscr/1/value: 'null'
  /dscr/2/value: '1.125'
  /pv_cfads: '693.94533742619746502146066887430563485293228638406'
  /llcr/value: '0.69394533742619746502146066887430563485293228638406'
  /not_computed/0/output: '/interest_cover_ebit'
  /not_computed/0/missing/0: '/interest_definition'
  /not_computed/1/output: '/interest_cover_ebitda'
  /not_computed/1/missing/0: '/interest_definition'
  /not_computed/2/output: '/dscr/1'
  /not_computed/2/missing/0: '/debt_schedule/periods/1/debt_service'
expect_length:
  /not_computed: '3'
tolerance: '0.00000000000000000001'
