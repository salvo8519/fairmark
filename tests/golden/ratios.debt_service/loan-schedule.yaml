method: ratios.debt_service
description: 'AC1 and AC4: interest cover, NFP / EBITDA, DSCR per period and LLCR on a five-period loan'
source: 'scripts/reference_ratios.py, debt_service (Python decimal, 50 digits, local context), written
  from the definitions in specs/0007-ratios-covenants/plan.md. Closed form: cover 500 / 100 = 5 and 800
  / 100 = 8; NFP 2200 - 300 = 1900, / 800 = 2.375; DSCR 320 / 250 = 1.28 ...; LLCR = sum of CFADS_t /
  1.06^t over t = 1..5, / 1000.'
input:
  balances: closing
  ebitda_definition: reported EBITDA, no adjustments
  interest_definition: gross interest expense
  income_statement:
    ebitda: '800'
    ebit: '500'
    interest: '100'
  closing:
    net_financial_position:
      gross_debt: '2200'
      cash: '300'
      other_items: []
  debt_schedule:
    discount_rate: '0.06'
    debt_outstanding: '1000'
    periods:
    - cfads: '320'
      debt_service: '250'
    - cfads: '330'
      debt_service: '250'
    - cfads: '300'
      debt_service: '240'
    - cfads: '310'
      debt_service: '240'
    - cfads: '290'
      debt_service: '230'
expect:
  /net_financial_position: '1900'
  /interest_cover_ebit/value: '5'
  /interest_cover_ebitda/value: '8'
  /nfp_to_ebitda/value: '2.375'
  /pv_cfads: '1309.7253083021628834244753565529220086549330650007'
  /llcr/value: '1.3097253083021628834244753565529220086549330650007'
  /dscr/0/value: '1.28'
  /dscr/1/value: '1.32'
  /dscr/2/value: '1.25'
  /dscr/3/value: '1.2916666666666666666666666666666666666666666666667'
  /dscr/4/value: '1.2608695652173913043478260869565217391304347826087'
tolerance: '0.000000001'
