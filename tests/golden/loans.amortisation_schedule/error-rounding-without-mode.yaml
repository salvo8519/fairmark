method: loans.amortisation_schedule
description: "Rounding without a mode (AC9)"
source: >
  SPEC-0009 R19 (the mode is stated explicitly, no default mode); AC9 (rounding without a mode returns FM-E001). The error code is part of the specification.
input: { principal: "1000", periodic_rate: "0.01", number_of_instalments: 12, timing: "ordinary", amortisation_type: "french", rounding: { decimal_places: 2 } }
expect_error: FM-E001
