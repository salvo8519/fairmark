method: loans.amortisation_schedule
description: "Fixed schedule, principal portion 0.5 rounded to 1 over 20 periods (R21)"
source: >
  SPEC-0009 R21 (FM-E023 when, with rounding, the balance would become negative before the last period); AC10 applied to the fixed amortisation schedule. The error code is part of the specification.
input: { principal: "10", periodic_rate: "0", number_of_instalments: 20, timing: "ordinary", amortisation_type: "fixed_amortisation_schedule", rounding: { decimal_places: 0, mode: "half_up" } }
expect_error: FM-E023
