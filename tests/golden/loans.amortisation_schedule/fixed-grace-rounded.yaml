method: loans.amortisation_schedule
description: "Fixed amortisation schedule, 3 grace periods, principal portion rounded to the cent (AC9)"
source: >
  Independent 50-digit reference, scripts/reference_loans.py; 60000 / 9 = 6666.666... rounds to
  6666.67; the last principal portion is 60000 - 8 x 6666.67 = 6666.64, final adjustment -0.03.
  Exact values, tolerance 0.
