method: loans.amortisation_schedule
description: "ECMA-376: principal portion of period 10, 200000 at 8% a year, 10 years (AC5)"
source: >
  ECMA-376 Part 1, SpreadsheetML formulas, principal portion function, worked example, viewed
  at https://webapp.docx4java.org/OnlineDemo/ecma376/SpreadsheetML/PPMT.html; published to two
  decimals, hence the tolerance of half a cent. Confirmed by Independent 50-digit reference,
  scripts/reference_loans.py.
input: { principal: "200000", rate: "0.08", compounding: "annual", payment_frequency: "annual", number_of_instalments: 10, timing: "ordinary", amortisation_type: "french" }
expect:
  /rows/9/principal_portion: "27598.05"
tolerance: "0.005"
