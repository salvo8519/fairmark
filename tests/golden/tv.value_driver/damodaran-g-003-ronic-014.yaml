method: tv.value_driver
description: Damodaran table cell growth 3.0%, return on capital 14%, NOPAT 100, rate 10% (AC1)
source: "Damodaran, NYU Stern valuation lectures (undergraduate, spring 2020), session 11 slides, table 'The Big Assumption': terminal value for after-tax operating income of 100 in year n+1 and a cost of capital of 10%, rounded to units (pages.stern.nyu.edu/~adamodar/podcasts/valUGspr20/session11slides.pdf); cell growth 3.0%, return on capital 14% = 1122"
input: { nopat_next: "100", growth: "0.03", ronic: "0.14", rate: "0.10" }
expect: { terminal_value: "1122" }
tolerance: "0.5"  # the published table is rounded to units; exact values are pinned by the reference cases
