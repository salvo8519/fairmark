# Golden case: values from scripts/reference_values.py (independent Decimal implementation).
method: dcf.fcff
description: Three explicit years, end-of-period discounting, net debt 200 (version 2 case re-expressed in version 3, AC15)
source: >
  scripts/reference_values.py (independent Decimal implementation), the expected values of the
  dcf.fcff version 2 case three-years-end-of-period.yaml, unchanged. Re-expressed in the version 3
  input on 2026-11-08 as the maintainer approved in SPEC-0001 ("Recorded approval of the
  numerical change", R30, AC15): one given stage, one rate, nominal terms, tv.gordon on the last
  flow grown, a net financial position equal to the previous net_debt; the version 2
  enterprise_value is compared with the version 3 value_of_operations.
input:
  stages: [{periods: 3, projection: given, flows: [100, 110, 120]}]
  cash_flow_terms: nominal
  discount_rate_terms: nominal
  wacc: "0.10"
  timing: end_of_period
  terminal: {"tv.gordon": {growth: "0.02", first_flow: last_flow_grown}}
  net_financial_position: {gross_debt: 200, cash: 0}
expect:
  value_of_operations: "1421.487603305785"
  equity_value: "1221.487603305785"
  /terminal/terminal_value: "1530"
  /terminal/present_value: "1149.511645379414"
  pv_explicit_period: "271.975957926371"
tolerance: "0.000000001"
