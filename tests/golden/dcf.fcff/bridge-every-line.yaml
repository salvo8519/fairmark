method: dcf.fcff
description: "From value of operations to equity value with every kind of bridge line: net financial position with other items, non-operating assets, debt-like items and a non-controlling interest (R23, R25; AC13)"
source: >
  Independent 50-digit reference, scripts/reference_dcf.py (Python decimal, written from
  SPEC-0001 R23 and R25; net financial position as in SPEC-0007 R6, sharing no code with the
  engine). Net financial position 900 - 150 + 120 - 20 = 850; non-operating assets 80 + 45.5 =
  125.5; debt-like items 95 + 32.25 = 127.25; non-controlling interests 210. Equity value =
  value of operations + 125.5 - 850 - 127.25 - 210. The measurement bases (present_value,
  other with its note, fair_value; Decision 21) are stated by the analyst and echoed, never
  used in the calculation.
input:
  stages: [{"periods": 4, "projection": "given", "flows": ["250", "270", "285", "300"]}]
  cash_flow_terms: "nominal"
  discount_rate_terms: "nominal"
  wacc: "0.09"
  timing: "end_of_period"
  terminal: {"tv.gordon": {"growth": "0.02", "first_flow": "last_flow_grown"}}
  net_financial_position: {"gross_debt": "900", "cash": "150", "other_items": [{"name": "lease liabilities", "amount": "120"}, {"name": "derivative assets", "amount": "-20"}]}
  non_operating_assets: [{"label": "Land held for sale", "value": "80"}, {"label": "Investment in an associate", "value": "45.5"}]
  debt_like_items: [{"label": "Unfunded pension obligation", "value": "95", "measurement_basis": "present_value", "basis_note": "obligation net of plan assets, after tax"}, {"label": "Environmental remediation provision", "value": "32.25", "measurement_basis": "other", "basis_note": "best estimate of the settlement amount, undiscounted"}]
  non_controlling_interests: [{"label": "30% of Subsidiary A", "value": "210", "measurement_basis": "fair_value"}]
expect:
  /value_of_operations: "3986.041459854787587216745174"
  /enterprise_value: "4111.541459854787587216745174"
  /equity_value: "2924.291459854787587216745174"
  /terminal_value_weight: "0.7769187148604156036532419069"
  /bridge/non_operating_assets_total: "125.5"
  /bridge/net_financial_position: "850"
  /bridge/debt_like_items_total: "127.25"
  /bridge/non_controlling_interests_total: "210"
  /bridge/debt_like_items/0/label: "Unfunded pension obligation"
  /bridge/debt_like_items/1/value: "32.25"
  /bridge/debt_like_items/0/measurement_basis: "present_value"
  /bridge/debt_like_items/0/basis_note: "obligation net of plan assets, after tax"
  /bridge/debt_like_items/1/measurement_basis: "other"
  /bridge/debt_like_items/1/basis_note: "best estimate of the settlement amount, undiscounted"
  /bridge/non_controlling_interests/0/label: "30% of Subsidiary A"
  /bridge/non_controlling_interests/0/measurement_basis: "fair_value"
tolerance: "0.00000000000000000001"
