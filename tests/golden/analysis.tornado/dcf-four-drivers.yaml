method: analysis.tornado
description: Equity value of a five-year DCF, four drivers ranked by swing
source: >
  scripts/reference_analysis.py, tornado_ranking (Python decimal, 50 digits, dcf.fcff restated
  from its documented formula; each driver varied alone, ranked by absolute swing).
  Inner input re-expressed in dcf.fcff version 3 on 2026-11-08 (SPEC-0001 R30, the
  maintainer-approved migration of dcf.fcff v2 to v3); every expected number unchanged.
