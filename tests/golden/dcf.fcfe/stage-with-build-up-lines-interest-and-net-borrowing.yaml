method: dcf.fcfe
description: "A given stage of FCFE built up from line items with interest expense and net borrowing (tax rate 24%, zero treatment of a negative EBIT in period 2, so no interest tax shield there), then constant growth, cost of equity, mid-period timing with the terminal value at N - 0.5 (R3, R4, R7, R21, R24)"
source: >
  Independent 50-digit references composed: scripts/reference_free_cash_flows.py builds the
  FCFE of the stages with lines (SPEC-0001 R2 to R4, amendment 14; equity_stages_with_flows),
  scripts/reference_dcf.py values the resulting flows (dcf_fcfe, R6 to R22, R24); neither
  shares code with the engine. FCFE_t = FCFF_t - interest_t x (1 - t) + net borrowing_t, with
  t = 0 in period 2 (amendment 14).
