method: dcf.fcfe
description: "Three stages of FCFE (given, then growth declining in linear increments) at a cost of equity per period with a terminal cost of equity, Gordon terminal value, and the equity bridge with non-operating assets, a debt-like item and a non-controlling interest (R1, R6 to R12, R22, R24, R25; AC13)"
source: >
  Independent 50-digit reference, scripts/reference_dcf.py (Python decimal, written from
  SPEC-0001 R22 and R24, sharing no code with the engine). Equity value = present value of the
  explicit FCFE + present value of the terminal value + non-operating assets 310 + 95.5 -
  debt-like items 140 - non-controlling interests 260; no net financial position, debt is in
  the flows (R24). Excess cash whose interest income is not in the FCFE is a non-operating
  asset ([S1] in the spec).
