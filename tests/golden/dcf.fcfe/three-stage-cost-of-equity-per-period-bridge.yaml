  cash_flow_terms: "nominal"
  discount_rate_terms: "nominal"
  cost_of_equity_per_period: ["0.125", "0.125", "0.12", "0.115", "0.11", "0.105"]
  terminal_cost_of_equity: "0.10"
  timing: "end_of_period"
  terminal: {"tv.gordon": {"growth": "0.03", "first_flow": "last_flow_grown"}}
  non_operating_assets: [{"label": "Excess cash not needed for operations, interest income not in the FCFE", "value": "310"}, {"label": "Investment property", "value": "95.5"}]
  debt_like_items: [{"label": "Unfunded pension obligation", "value": "140", "measurement_basis": "present_value", "basis_note": "net of plan assets, after tax"}]
  non_controlling_interests: [{"label": "25% of Subsidiary B", "value": "260", "measurement_basis": "fair_value"}]
