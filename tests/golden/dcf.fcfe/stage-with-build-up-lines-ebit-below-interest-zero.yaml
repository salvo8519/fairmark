method: dcf.fcfe
description: "FCFE built up from line items under the zero treatment with EBIT above the interest (period 1), positive but below the interest (period 2: shield limited to EBIT) and negative (period 3: no shield), then constant growth, Gordon on a normalised flow (R3, R4, R7, R24; Decision 22)"
source: >
  Independent 50-digit references composed: scripts/reference_free_cash_flows.py builds the
  FCFE of the stages with lines (SPEC-0001 R2 to R4, amendment 14; equity_stages_with_flows),
  scripts/reference_dcf.py values the resulting flows (dcf_fcfe, R6 to R22, R24); neither
  shares code with the engine. Decision 22: under zero the interest tax shield is t x
  min(interest, max(EBIT, 0)): period 1 shield 0.24 x 95 = 22.80; period 2 EBIT 60 below
  interest 100, taxes on EBIT 14.40, FCFF = 60 - 14.40 + 145 - 150 + 8 = 48.60, shield 0.24 x
  60 = 14.40 (not 0.24 x 100 = 24.00), FCFE = 48.60 - (100 - 14.40) + 70 = 33.00, equal to the
  net-income route (pre-tax income -40, no tax: -40 + 145 - 150 + 8 + 70 = 33.00; with the
  unlimited shield it would be 42.60); period 3 no shield, FCFE = -17 - 104 + 90 = -31.00.
