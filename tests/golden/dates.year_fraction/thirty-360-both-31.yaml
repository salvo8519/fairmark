method: dates.year_fraction
description: 30/360 Bond Basis moves both days 31 to 30 when the start day is 31
source: 2006 ISDA Definitions section 4.16(f); Independent 50-digit reference, scripts/reference_time.py
input: { start: "2024-01-31", end: "2024-03-31", day_count: thirty_360 }
expect: { year_fraction: "0.16666666666666666667" }
tolerance: "0.0000000000000000001"
