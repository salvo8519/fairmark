method: tvm.future_value
description: "ECMA-376: 12 payments of 1000 at 1% a period, ordinary (AC4)"
source: >
  ECMA-376 Part 1, SpreadsheetML formulas, future value function, worked examples, viewed at
  https://webapp.docx4java.org/OnlineDemo/ecma376/SpreadsheetML/FV.html, converted to the sign
  convention of R10 (same sign accumulates); published to two decimals, hence the tolerance of
  half a cent. Confirmed by Independent 50-digit reference, scripts/reference_loans.py.
input: { payment: "1000", rate: "0.01", periods: 12, timing: "ordinary" }
expect:
  future_value: "12682.50"
tolerance: "0.005"
