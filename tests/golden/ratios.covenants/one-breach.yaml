method: ratios.covenants
description: 'AC5: a covenant set with one breach reports the breach and the headroom of the others'
source: 'scripts/reference_ratios.py, covenants (Python fractions for the outcome and the contractual
  rounding, decimal at 50 digits for the printed values), written from the covenant rules in specs/0007-ratios-covenants/plan.md
  and the maintainer decisions of 2026-11-08 in spec.md. Closed form: net leverage 1900 / 600 = 3.1666...,
  at most 3.5, headroom 3.5 - 3.1666... = 0.3333..., relative 0.3333... / 3.5; interest cover 600 / 175
  = 3.428571..., at least 4, headroom 3.428571... - 4 = -0.571428... (breach); DSCR 700 / 530 = 1.320754...,
  at least 1.2, headroom 0.120754...'
input:
  covenants:
  - name: net leverage
    test_date: '2026-12-31'
    numerator:
      definition: consolidated net financial debt at the test date
      amount: '1900'
    denominator:
      definition: consolidated EBITDA for the 12 months ending on the test date
      amount: '600'
    operator: at_most
    threshold: '3.5'
    if_denominator_not_positive: not_tested
  - name: interest cover
    test_date: '2026-12-31'
    numerator:
      definition: consolidated EBITDA for the 12 months ending on the test date
      amount: '600'
    denominator:
      definition: net finance charges for the 12 months ending on the test date
      amount: '175'
    operator: at_least
    threshold: '4'
    if_denominator_not_positive: not_tested
  - name: debt service cover
    test_date: '2026-12-31'
    numerator:
      definition: cash flow available for debt service for the 12 months ending on the test date
      amount: '700'
    denominator:
      definition: debt service for the 12 months ending on the test date
      amount: '530'
    operator: at_least
    threshold: '1.2'
    if_denominator_not_positive: not_tested
expect:
  /covenants/0/outcome: passed
  /covenants/0/not_tested_code: 'null'
  /covenants/0/value: '3.1666666666666666666666666666666666666666666666667'
  /covenants/0/value_unrounded: 'null'
  /covenants/0/headroom: '0.33333333333333333333333333333333333333333333333333'
  /covenants/0/headroom_relative/value: '0.095238095238095238095238095238095238095238095238094'
  /covenants/1/outcome: breached
  /covenants/1/not_tested_code: 'null'
  /covenants/1/value: '3.4285714285714285714285714285714285714285714285714'
  /covenants/1/value_unrounded: 'null'
  /covenants/1/headroom: '-0.57142857142857142857142857142857142857142857142857'
  /covenants/1/headroom_relative/value: '-0.14285714285714285714285714285714285714285714285714'
  /covenants/2/outcome: passed
  /covenants/2/not_tested_code: 'null'
  /covenants/2/value: '1.3207547169811320754716981132075471698113207547170'
  /covenants/2/value_unrounded: 'null'
  /covenants/2/headroom: '0.12075471698113207547169811320754716981132075471698'
