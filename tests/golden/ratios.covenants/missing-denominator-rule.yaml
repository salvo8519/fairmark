method: ratios.covenants
description: A covenant without if_denominator_not_positive is refused, there is no default
source: 'Constructed. Maintainer decision 1 (2026-11-08): the outcome for a zero or negative denominator
  is a required input (FM-E001).'
input:
  covenants:
  - name: net leverage
    test_date: '2026-12-31'
    numerator:
      definition: consolidated net financial debt at the test date
      amount: '1900'
    denominator:
      definition: consolidated EBITDA for the 12 months ending on the test date
      amount: '600'
    operator: at_most
    threshold: '3.5'
expect_error: FM-E001
