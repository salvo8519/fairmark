method: ratios.profitability
description: 'AC3: zero revenue makes the margins not defined, the others are computed'
source: 'scripts/reference_ratios.py, profitability (Python decimal, 50 digits, local context), written
  from the definitions in specs/0007-ratios-covenants/plan.md. Revenue 0: ROS, EBITDA margin, EBIT margin
  and net margin not defined; turnover 0 / 4000 = 0.'
input:
  balances: closing
  operating_return_base: invested_capital
  ebitda_definition: reported EBITDA, no adjustments
  income_statement:
    revenue: '0'
    ebitda: '800'
    ebit: '500'
    net_income: '260'
  closing:
    equity: '2000'
    total_assets: '6000'
    invested_capital: '4000'
