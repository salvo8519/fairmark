method: ratios.profitability
description: 'Decision 7: negative invested capital makes ROI not meaningful, the others are computed'
source: 'scripts/reference_ratios.py, profitability (Python decimal, 50 digits, local context), written
  from the definitions in specs/0007-ratios-covenants/plan.md. Invested capital -500: ROI not defined;
  ROA 500 / 6000; capital turnover 5000 / -500 = -10; no leverage inputs.'
input:
  balances: closing
  operating_return_base: invested_capital
  ebitda_definition: reported EBITDA, no adjustments
  income_statement:
    revenue: '5000'
    ebitda: '800'
    ebit: '500'
    net_income: '260'
  closing:
    equity: '2000'
    total_assets: '6000'
    invested_capital: '-500'
expect:
  /roe/value: '0.13'
  /roi/value: 'null'
  /roa/value: '0.083333333333333333333333333333333333333333333333333'
  /ros/value: '0.1'
  /ebitda_margin/value: '0.16'
  /ebit_margin/value: '0.1'
  /capital_turnover/value: '-10'
  /roe_three_factor/net_margin/value: '0.052'
  /roe_three_factor/asset_turnover/value: '0.83333333333333333333333333333333333333333333333333'
  /roe_three_factor/equity_multiplier/value: '3'
  /roe_three_factor/roe/value: '0.13000000000000000000000000000000000000000000000000'
  /roe_leverage/roi/value: 'null'
  /roe_leverage/cost_of_debt/value: 'null'
  /roe_leverage/debt_to_equity/value: 'null'
  /roe_leverage/leverage_effect/value: 'null'
  /roe_leverage/pre_tax_roe/value: 'null'
  /roe_leverage/tax_rate/value: 'null'
  /roe_leverage/roe/value: 'null'
  /roi/not_defined: invested capital is negative (-500)
  /roe_leverage/roe/not_defined: leverage inputs not given
  /roe_leverage/cost_of_debt/not_defined: leverage inputs not given
tolerance: '0.00000000000000000001'
