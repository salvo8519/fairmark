method: ratios.profitability
description: 'R7: the minimal input for ROE, net income and equity only'
source: scripts/reference_ratios_partial.py (Python decimal, 50 digits, local context), written from the
  formulas and the computability tables of specs/0007-ratios-covenants/spec.md (amendment of 2026-11-09).
  ROE 260 / 2000 = 0.13; every other ratio lacks an input.
input:
  balances: closing
  operating_return_base: total_assets
  income_statement:
    net_income: '260'
  closing:
    equity: '2000'
expect:
  /roe/value: '0.13'
  /roi/value: 'null'
  /roa/value: 'null'
  /ros/value: 'null'
  /ebitda_margin/value: 'null'
  /ebit_margin/value: 'null'
  /capital_turnover/value: 'null'
  /roe_three_factor/net_margin/value: 'null'
  /roe_three_factor/asset_turnover/value: 'null'
  /roe_three_factor/equity_multiplier/value: 'null'
  /roe_three_factor/roe/value: 'null'
  /roe_leverage/roi/value: 'null'
  /roe_leverage/cost_of_debt/value: 'null'
  /roe_leverage/debt_to_equity/value: 'null'
  /roe_leverage/leverage_effect/value: 'null'
  /roe_leverage/pre_tax_roe/value: 'null'
  /roe_leverage/tax_rate/value: 'null'
  /roe_leverage/roe/value: 'null'
tolerance: '0.00000000000000000001'
expect_counts:
  not_computed: '17'
expect_not_computed:
  /value/capital_turnover:
    /missing_any_of/0/0: /closing/total_assets
    /missing_any_of/0/1: /income_statement/revenue
  /value/ebit_margin:
    /missing_any_of/0/0: /income_statement/ebit
    /missing_any_of/0/1: /income_statement/revenue
  /value/ebitda_margin:
    /missing_any_of/0/0: /ebitda_definition
    /missing_any_of/0/1: /income_statement/ebitda
    /missing_any_of/0/2: /income_statement/revenue
  /value/roa:
    /missing_any_of/0/0: /closing/total_assets
    /missing_any_of/0/1: /income_statement/ebit
  /value/roe_leverage/cost_of_debt:
    /missing_any_of/0/0: /leverage
  /value/roe_leverage/debt_to_equity:
    /missing_any_of/0/0: /leverage
  /value/roe_leverage/leverage_effect:
    /missing_any_of/0/0: /leverage
  /value/roe_leverage/pre_tax_roe:
    /missing_any_of/0/0: /leverage
  /value/roe_leverage/roe:
    /missing_any_of/0/0: /leverage
  /value/roe_leverage/roi:
    /missing_any_of/0/0: /leverage
  /value/roe_leverage/tax_rate:
    /missing_any_of/0/0: /leverage
  /value/roe_three_factor/asset_turnover:
    /missing_any_of/0/0: /closing/total_assets
    /missing_any_of/0/1: /income_statement/revenue
  /value/roe_three_factor/equity_multiplier:
    /missing_any_of/0/0: /closing/total_assets
  /value/roe_three_factor/net_margin:
    /missing_any_of/0/0: /income_statement/revenue
  /value/roe_three_factor/roe:
    /missing_any_of/0/0: /closing/total_assets
    /missing_any_of/0/1: /income_statement/revenue
  /value/roi:
