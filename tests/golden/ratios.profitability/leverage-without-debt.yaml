method: ratios.profitability
description: The leverage form without D in the balance sheet is refused
source: Constructed. Leverage inputs are given but the closing balance sheet has no `debt`, the D
  of the chosen basis (FM-E001).
input:
  balances: closing
  operating_return_base: invested_capital
  ebitda_definition: reported EBITDA, no adjustments
  income_statement:
    revenue: '5000'
    ebitda: '800'
    ebit: '500'
    net_income: '260'
  closing:
    equity: '2000'
    total_assets: '6000'
    invested_capital: '4000'
  leverage:
    debt_basis: net_financial_position
    financial_charges: '100'
    taxes: '140'
    pre_tax_income: '400'
expect_error: FM-E001
