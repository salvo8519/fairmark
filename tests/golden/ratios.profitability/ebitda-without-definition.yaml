method: ratios.profitability
description: 'R9: EBITDA given without its definition: the EBITDA margin is not computed'
source: scripts/reference_ratios_partial.py (Python decimal, 50 digits, local context), written from the
  formulas and the computability tables of specs/0007-ratios-covenants/spec.md (amendment of 2026-11-09).
  The EBITDA margin needs `/ebitda_definition`; the other ratios are computed on total assets.
input:
  balances: closing
  operating_return_base: total_assets
  income_statement:
    revenue: '5000'
    ebitda: '800'
    ebit: '500'
    net_income: '260'
  closing:
    equity: '2000'
    total_assets: '6000'
expect:
  /roe/value: '0.13'
  /roi/value: '0.083333333333333333333333333333333333333333333333333'
  /roa/value: '0.083333333333333333333333333333333333333333333333333'
  /ros/value: '0.1'
  /ebitda_margin/value: 'null'
  /ebit_margin/value: '0.1'
  /capital_turnover/value: '0.83333333333333333333333333333333333333333333333333'
  /roe_three_factor/net_margin/value: '0.052'
  /roe_three_factor/asset_turnover/value: '0.83333333333333333333333333333333333333333333333333'
  /roe_three_factor/equity_multiplier/value: '3'
  /roe_three_factor/roe/value: '0.13000000000000000000000000000000000000000000000000'
  /roe_leverage/roi/value: 'null'
  /roe_leverage/cost_of_debt/value: 'null'
  /roe_leverage/debt_to_equity/value: 'null'
  /roe_leverage/leverage_effect/value: 'null'
  /roe_leverage/pre_tax_roe/value: 'null'
  /roe_leverage/tax_rate/value: 'null'
  /roe_leverage/roe/value: 'null'
  /not_computed/0/output: '/ebitda_margin'
  /not_computed/0/missing/0: '/ebitda_definition'
  /not_computed/1/output: '/roe_leverage/roi'
  /not_computed/1/missing/0: '/leverage'
  /not_computed/2/output: '/roe_leverage/cost_of_debt'
  /not_computed/2/missing/0: '/leverage'
  /not_computed/3/output: '/roe_leverage/debt_to_equity'
  /not_computed/3/missing/0: '/leverage'
  /not_computed/4/output: '/roe_leverage/leverage_effect'
  /not_computed/4/missing/0: '/leverage'
  /not_computed/5/output: '/roe_leverage/pre_tax_roe'
  /not_computed/5/missing/0: '/leverage'
  /not_computed/6/output: '/roe_leverage/tax_rate'
  /not_computed/6/missing/0: '/leverage'
  /not_computed/7/output: '/roe_leverage/roe'
  /not_computed/7/missing/0: '/leverage'
