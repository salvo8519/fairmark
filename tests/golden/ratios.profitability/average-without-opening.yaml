method: ratios.profitability
description: 'R2, R7: average balances without the opening balance sheet: balance-sheet ratios not computed,
  flow ratios computed'
source: 'scripts/reference_ratios_partial.py (Python decimal, 50 digits, local context), written from
  the formulas and the computability tables of specs/0007-ratios-covenants/spec.md (amendment of 2026-11-09).
  Average balances need opening and closing amounts; the opening block is missing; version 1 refused the
  input (FM-E001), replaced under the maintainer approval of 2026-11-09 (issue #262).'
input:
  balances: average
  operating_return_base: total_assets
  ebitda_definition: reported EBITDA, no adjustments
  income_statement:
    revenue: '5000'
    ebitda: '800'
    ebit: '500'
    net_income: '260'
  closing:
    equity: '2000'
    total_assets: '6000'
