method: ratios.profitability
description: 'R2: average balances without the opening balance sheet are refused'
source: Constructed. Average balances need opening and closing balances; the opening block is
  missing, so the input is incomplete (FM-E001).
input:
  balances: average
  operating_return_base: total_assets
  ebitda_definition: reported EBITDA, no adjustments
  income_statement:
    revenue: '5000'
    ebitda: '800'
    ebit: '500'
    net_income: '260'
  closing:
    equity: '2000'
    total_assets: '6000'
expect_error: FM-E001
