  "/start_dates/1": "2025-02-28"
  "/start_dates/2": "2026-02-28"
  "/start_dates/3": "2027-02-28"
  "/end_dates/0": "2025-02-28"
  "/end_dates/1": "2026-02-28"
  "/end_dates/2": "2027-02-28"
  "/end_dates/3": "2028-02-29"
  "/months_per_period": "12"
  "/periods_per_year": "1"
tolerance: "0"
