method: analysis.goal_seek
description: Discount rate at which the DCF enterprise value equals an offer of 1300
source: >
  scripts/reference_analysis.py (Python decimal, 50 digits, bisection to 1e-30, dcf.fcff
  restated from its documented formula): 0.107373099787207080471595861361.
  Inner input re-expressed in dcf.fcff version 3 on 2026-11-08 (SPEC-0001 R30, the
  maintainer-approved migration of dcf.fcff v2 to v3); every expected number unchanged.
input:
  method: dcf.fcff
  base_input:
    stages: [{periods: 3, projection: given, flows: [100, 110, 120]}]
    cash_flow_terms: nominal
    discount_rate_terms: nominal
    wacc: "0.10"
    timing: end_of_period
    terminal: {"tv.gordon": {growth: "0.02", first_flow: last_flow_grown}}
    net_financial_position: {gross_debt: 200, cash: 0}
  variable: /wacc
  output: /enterprise_value
  target: "1300"
  bracket: ["0.05", "0.5"]
expect:
  solution: "0.107373099787207080471595861361"
tolerance: "0.000000000001"
