method: tv.limited_horizon
description: Flow 1e9 for 600 periods at 10%; no value at N + n is computed, so no overflow (R5)
source: Independent 50-digit reference, scripts/reference_tv.py (term-by-term sum, 9999999999.9999999999999985398788054275665027770396); closed form 1e10 × (1 − 1.1^-600)
input: { flow: "1000000000", rate: "0.10", periods: 600 }
expect:
  terminal_value: "9999999999.9999999999999985398788"
  flows_value: "9999999999.9999999999999985398788"
tolerance: "0.000000000000000001"  # 1e-18: the engine keeps 28 significant digits, so a value near 1e10 is exact to 1e-18 (gap to the reference 1.2e-19)
