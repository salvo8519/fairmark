method: ratios.liquidity
description: 'AC3: zero current liabilities make the three ratios not defined, the margins are computed'
source: scripts/reference_ratios.py, liquidity (Python decimal, 50 digits, local context), written from
  the definitions in specs/0007-ratios-covenants/plan.md. Current liabilities 0.
input:
  balances: closing
  closing:
    current_assets: '2500'
    inventories: '900'
    cash: '200'
    current_liabilities: '0'
expect:
  /current_ratio/value: 'null'
  /quick_ratio/value: 'null'
  /cash_ratio/value: 'null'
  /net_working_capital: '2500'
  /treasury_margin: '1600'
  /current_ratio/not_defined: current liabilities is zero
  /quick_ratio/not_defined: current liabilities is zero
  /cash_ratio/not_defined: current liabilities is zero
tolerance: '0.000000001'
