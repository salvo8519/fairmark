  years:
  - label: '2024'
    date: '2024-12-31'
    reclassified:
      balance_sheet:
        operating_fixed_assets: '1020000'
        operating_working_capital:
          total: '680000'
          trade_receivables: '800000'
          inventories: '400000'
          other_operating_assets: '180000'
          trade_payables: '500000'
          other_operating_liabilities: '200000'
        operating_provisions: '240000'
        invested_capital: '1460000'
        non_operating_assets:
        - label: Financial fixed assets (B.III)
          value: '150000'
        total_funds_invested: '1610000'
        equity: '900000'
        quasi_equity_items: []
        net_financial_position:
          total: '710000'
          position:
            gross_debt: '1000000'
            cash: '240000'
            other_items:
            - name: Current financial assets (C.III)
              amount: '-60000'
            - name: Derivative liabilities (B)
              amount: '10000'
          current: '100000'
          non_current: '610000'
        debt_like_items: []
        total_sources: '1610000'
