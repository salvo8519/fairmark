method: statements.reorganise
description: 'SPEC-0012 R5, R7, R12, R13 (T16): the reclassified balance sheet of the golden case reclassified-balance-sheet,
  without an income statement: the outputs that only the statutory form supplies (the composition of the
  net financial position, the current and non-current block) are not_applicable, with no input to give;
  every relation of the reclassified form is a check of /value/years/0, ordered by id, those of the balance
  sheet reconciled (every total given equals its parts), those of the income statement not_checked; value
  holds no list'
source: 'Written by hand from the rules, not from the engine output. SPEC-0005 R13 and R15 (the composition
  and the current and non-current amounts need the statutory form), the relation ids of the reclassified
  form listed in the inventory of specs/0012-envelope-diagnostics/spec.md (reclassified.rs and income_statement.rs),
  SPEC-0005 R7 (a relation with a side missing is not_checked), SPEC-0012 R5 (not_applicable: no input
  could supply the output in the form given), R7 (checks by year, then by id) and R13 (not_computed by
  pointer: balance_sheet before current_non_current before income_statement).'
input:
  years:
  - label: '2024'
    date: '2024-12-31'
    reclassified:
      balance_sheet:
        operating_fixed_assets: '1020000'
        operating_working_capital:
          total: '680000'
          trade_receivables: '800000'
          inventories: '400000'
          other_operating_assets: '180000'
          trade_payables: '500000'
          other_operating_liabilities: '200000'
        operating_provisions: '240000'
        invested_capital: '1460000'
        non_operating_assets:
        - label: Financial fixed assets (B.III)
          value: '150000'
        total_funds_invested: '1610000'
        equity: '900000'
        quasi_equity_items: []
        net_financial_position:
          total: '710000'
          position:
            gross_debt: '1000000'
            cash: '240000'
            other_items:
            - name: Current financial assets (C.III)
              amount: '-60000'
            - name: Derivative liabilities (B)
              amount: '10000'
          current: '100000'
          non_current: '610000'
        debt_like_items: []
        total_sources: '1610000'
expect:
  /years/0/form: reclassified
tolerance: '0'
expect_checks:
  /value/years/0 ebitda_total:
    /status: not_checked
  /value/years/0 funds_invested_equals_sources:
    /status: reconciled
  /value/years/0 invested_capital_total:
    /status: reconciled
  /value/years/0 net_financial_position_maturity:
    /status: reconciled
  /value/years/0 net_financial_position_total:
    /status: reconciled
  /value/years/0 net_income_total:
    /status: not_checked
  /value/years/0 operating_profit_total:
    /status: not_checked
  /value/years/0 operating_working_capital_total:
    /status: reconciled
  /value/years/0 profit_before_financing_and_taxes_total:
    /status: not_checked
  /value/years/0 profit_before_tax_total:
    /status: not_checked
  /value/years/0 total_funds_invested_total:
    /status: reconciled
  /value/years/0 total_sources_total:
    /status: reconciled
  /value/years/0 value_added_total:
    /status: not_checked
expect_counts:
  checks: '13'
  warnings: '0'
expect_not_computed:
  /value/years/0/balance_sheet/sources/net_financial_position/composition:
    /missing_any_of#count: '0'
    /reason_code: not_applicable
  /value/years/0/current_non_current/cash:
    /missing_any_of#count: '0'
    /reason_code: not_applicable
  /value/years/0/current_non_current/current_assets:
    /reason_code: not_applicable
  /value/years/0/current_non_current/current_liabilities:
    /reason_code: not_applicable
  /value/years/0/current_non_current/fixed_assets:
    /reason_code: not_applicable
  /value/years/0/current_non_current/non_current_liabilities:
    /reason_code: not_applicable
  /value/years/0/current_non_current/total_assets:
    /reason_code: not_applicable
