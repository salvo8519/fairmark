method: statements.reorganise
description: 'SPEC-0012 R5, R7, R12, R13 (T16): the reclassified balance sheet of the golden case reclassified-balance-sheet,
  without an income statement: the outputs that only the statutory form supplies (the composition of the
  net financial position, the current and non-current block) are not_applicable, with no input to give;
  every relation of the reclassified form is a check of /value/years/0, ordered by id, those of the balance
  sheet reconciled (every total given equals its parts), those of the income statement not_checked; value
  holds no list'
source: 'Written by hand from the rules, not from the engine output. SPEC-0005 R13 and R15 (the composition
  and the current and non-current amounts need the statutory form), the relation ids of the reclassified
  form listed in the inventory of specs/0012-envelope-diagnostics/spec.md (reclassified.rs and income_statement.rs),
  SPEC-0005 R7 (a relation with a side missing is not_checked), SPEC-0012 R5 (not_applicable: no input
  could supply the output in the form given), R7 (checks by year, then by id) and R13 (not_computed by
  pointer: balance_sheet before current_non_current before income_statement).'
