method: statements.reorganise
description: 'D1-IS: B10 a to c (200000) and its B10 a, b part (180000) given, B10 c not given: B10 c
  is the difference (20000), assigned at the group it is read from, and every layer equals abridged-aggregates,
  where B10 c is given; more input never gives fewer outputs; the step B10 c = B10 a to c 200000 - B10
  a, b 180000 and its convention are asserted by the Rust test a_derived_b10_c_is_explained_and_assigned
  (golden cases assert value and meta only)'
source: 'scripts/reference_statements.py (Python decimal, 50 digits, local context). Written by the same
  agent as the engine and after the engine''s income statement code existed: the reference section for
  D1-IS was changed from the decisions recorded in specs/0005-statements-reclassification/spec.md before
  the engine change of the same round (test first), not before the engine as a whole.'
