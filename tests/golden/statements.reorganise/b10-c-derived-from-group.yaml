  years:
  - label: '2024'
    date: '2024-12-31'
    statutory:
      layout: abridged
      income_statement:
        revenue: '5000000'
        change_in_product_inventories: '40000'
        own_work_capitalised: '10000'
        other_revenue_and_income: '50000'
        purchases: '2200000'
        services: '1244000'
        use_of_third_party_assets: '150000'
        personnel_costs: '1000000'
        depreciation_and_write_downs:
