  every total given reconciles with its value derived by Appendix B.1 and the outputs equal those of the
  statutory form'
source: scripts/reference_statements.py (Python decimal, 50 digits, local context), written from Appendices
  A.1, B.1 and C of specs/0005-statements-reclassification/spec.md and R2 to R15, R22, without reading
  the Rust code.
