method: statements.reorganise
description: 'AC2, R6: only A1, B9, the total of B10 and C.IV given; revenue, personnel costs and the
  cash outputs are computed, every other output is null and listed in not_computed with the pointers of
  its missing inputs; none is zero for lack of input'
source: scripts/reference_statements.py (Python decimal, 50 digits, local context); its income statement
  section was written from Appendices A.2, B.2 and C of specs/0005-statements-reclassification/spec.md,
  R16 to R21 and Decision 17 before the engine's income statement code existed. The later decisions (E1
  to E6, P1, P2, A2 to A4) and corrections (D1-IS to D3-IS) were added to the reference by the same agent,
  each before the engine change of its round, and the expectations were regenerated from it.
input:
  years:
  - label: '2024'
    statutory:
      balance_sheet:
        cash: '240000'
      income_statement:
        revenue: '5000000'
        personnel_costs: '1000000'
        depreciation_and_write_downs:
          total: '215000'
expect:
  /years/0/income_statement/revenue: '5000000'
  /years/0/income_statement/personnel_costs: '1000000'
  /years/0/income_statement/value_of_production: 'null'
  /years/0/income_statement/ebitda: 'null'
  /years/0/income_statement/depreciation_and_amortisation: 'null'
  /years/0/income_statement/non_recurring_result: '0'
  /years/0/balance_sheet/excess_cash: '240000'
  /years/0/current_non_current/cash: '240000'
tolerance: '0'
expect_not_computed:
  /value/years/0/income_statement/depreciation_and_amortisation:
    /missing_any_of/0/0: /years/0/statutory/income_statement/depreciation_and_write_downs/depreciation_and_amortisation
    /missing_any_of/0/1: /years/0/statutory/income_statement/depreciation_and_write_downs/write_downs_of_fixed_assets
  /value/years/0/income_statement/net_income:
    /missing_any_of/0/0: /years/0/statutory/income_statement/change_in_product_inventories
    /missing_any_of/0/1: /years/0/statutory/income_statement/change_in_raw_material_inventories
    /missing_any_of/0/10: /years/0/statutory/income_statement/other_operating_expenses
    /missing_any_of/0/11: /years/0/statutory/income_statement/other_provisions
    /missing_any_of/0/12: /years/0/statutory/income_statement/other_revenue_and_income
    /missing_any_of/0/13: /years/0/statutory/income_statement/own_work_capitalised
    /missing_any_of/0/14: /years/0/statutory/income_statement/provisions_for_risks
    /missing_any_of/0/15: /years/0/statutory/income_statement/purchases
    /missing_any_of/0/16: /years/0/statutory/income_statement/revaluations_of_financial_assets
    /missing_any_of/0/17: /years/0/statutory/income_statement/services
    /missing_any_of/0/18: /years/0/statutory/income_statement/use_of_third_party_assets
    /missing_any_of/0/19: /years/0/statutory/income_statement/write_downs_of_financial_assets
    /missing_any_of/0/2: /years/0/statutory/income_statement/depreciation_and_write_downs/depreciation_and_amortisation
    /missing_any_of/0/3: /years/0/statutory/income_statement/depreciation_and_write_downs/write_downs_of_fixed_assets
    /missing_any_of/0/4: /years/0/statutory/income_statement/depreciation_and_write_downs/write_downs_of_receivables
    /missing_any_of/0/5: /years/0/statutory/income_statement/exchange_gains_and_losses
    /missing_any_of/0/6: /years/0/statutory/income_statement/income_from_equity_investments
