method: ratios.capital_structure
description: 'R7, R12: the minimal input for the equity ratio'
source: scripts/reference_ratios_partial.py (Python decimal, 50 digits, local context), written from the
  formulas and the computability tables of specs/0007-ratios-covenants/spec.md (amendment of 2026-11-09).
  Equity ratio 2000 / 6000; every other output lacks an input.
input:
  balances: closing
  closing:
    equity: '2000'
    total_assets: '6000'
expect:
  /net_financial_position: 'null'
  /debt_to_equity/value: 'null'
  /nfp_to_equity/value: 'null'
  /equity_ratio/value: '0.33333333333333333333333333333333333333333333333333'
  /primary_structure_margin: 'null'
  /secondary_structure_margin: 'null'
  /primary_fixed_asset_coverage/value: 'null'
  /secondary_fixed_asset_coverage/value: 'null'
expect_diagnostics_length:
  /not_computed: '7'
expect_diagnostics:
  /not_computed/1/pointer: /value/net_financial_position
  /not_computed/1/missing_any_of/0/0: '/closing/net_financial_position/cash'
  /not_computed/1/missing_any_of/0/1: '/closing/net_financial_position/gross_debt'
  /not_computed/0/pointer: /value/debt_to_equity
  /not_computed/0/missing_any_of/0/0: '/closing/net_financial_position/gross_debt'
  /not_computed/2/pointer: /value/nfp_to_equity
  /not_computed/2/missing_any_of/0/0: '/closing/net_financial_position/cash'
  /not_computed/2/missing_any_of/0/1: '/closing/net_financial_position/gross_debt'
  /not_computed/4/pointer: /value/primary_structure_margin
  /not_computed/4/missing_any_of/0/0: '/closing/fixed_assets'
  /not_computed/6/pointer: /value/secondary_structure_margin
  /not_computed/6/missing_any_of/0/0: '/closing/fixed_assets'
  /not_computed/6/missing_any_of/0/1: '/closing/non_current_liabilities'
  /not_computed/3/pointer: /value/primary_fixed_asset_coverage
  /not_computed/3/missing_any_of/0/0: '/closing/fixed_assets'
  /not_computed/5/pointer: /value/secondary_fixed_asset_coverage
  /not_computed/5/missing_any_of/0/0: '/closing/fixed_assets'
  /not_computed/5/missing_any_of/0/1: '/closing/non_current_liabilities'
tolerance: '0.00000000000000000001'
