method: ratios.capital_structure
description: 'AC3: negative equity makes D/E and NFP/E not defined, the others are computed'
source: 'scripts/reference_ratios.py, capital_structure (Python decimal, 50 digits, local context), written
  from the definitions in specs/0007-ratios-covenants/plan.md. Equity -200: D/E and NFP/E not defined;
  equity ratio -200 / 6000.'
input:
  balances: closing
  closing:
    equity: '-200'
    total_assets: '6000'
    fixed_assets: '3500'
    non_current_liabilities: '1800'
    net_financial_position:
      gross_debt: '2200'
      cash: '300'
      other_items:
      - name: lease liabilities
        amount: '150'
expect:
  /net_financial_position: '2050'
  /debt_to_equity/value: 'null'
  /nfp_to_equity/value: 'null'
  /equity_ratio/value: '-0.033333333333333333333333333333333333333333333333333'
  /primary_structure_margin: '-3700'
  /secondary_structure_margin: '-1900'
  /primary_fixed_asset_coverage/value: '-0.057142857142857142857142857142857142857142857142857'
  /secondary_fixed_asset_coverage/value: '0.45714285714285714285714285714285714285714285714286'
  /debt_to_equity/not_defined: equity is negative (-200)
  /nfp_to_equity/not_defined: equity is negative (-200)
tolerance: '0.00000000000000000001'
