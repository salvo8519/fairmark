method: coc.beta_peers
description: Three comparables unlevered by Harris-Pringle with debt beta 0.1, mean relevered to D/E 0.25
source: "closed form: beta_U = (beta_L + 0.1 × D/E) / (1 + D/E): (1.2 + 0.05) / 1.5 = 0.8333..., (0.9 + 0.02) / 1.2 = 0.7666..., (1.0 + 0.0) / 1 = 1; mean = 2.6 / 3; relevered = mean + (mean − 0.1) × 0.25"
input:
  formula: harris_pringle
  statistic: mean
  debt_beta: "0.1"
  target_debt_to_equity: "0.25"
  target_tax_rate: "0.24"
  peers:
    - { name: Peer A, levered_beta: "1.2", debt_to_equity: "0.5", tax_rate: "0.24" }
    - { name: Peer B, levered_beta: "0.9", debt_to_equity: "0.2", tax_rate: "0.3" }
    - { name: Peer C, levered_beta: "1.0", debt_to_equity: "0", tax_rate: "0.24" }
expect:
  mean_unlevered_beta: "0.8666666666666666666666666667"
  selected_unlevered_beta: "0.8666666666666666666666666667"
  relevered_beta: "1.0583333333333333333333333334"
tolerance: "0.0000000000000000000000000002"
