method: loans.instalment
description: 'ADR 0014 G5 (issue #258): validation reports every input error in `errors`, in the canonical
  order (issue #370): number of instalments, rate form, principal, rounding; the first is also at the top
  level'
source: 'SPEC-0009 R1a, R2, R19 (each condition is FM-E001) and ADR 0014 G5 (every input error in `errors`,
  the first at the top level). The order is the canonical order of the maintainer decision of 2026-11-17
  under ADR 0014 G5 (by pointer, then code, then message): /number_of_instalments, /periodic_rate,
  /principal, /rounding/decimal_places. Written from the spec and the ADR, not from the engine''s output.'
input:
  principal: '0'
  number_of_instalments: 0
  timing: ordinary
  rounding:
    decimal_places: 9
    mode: half_up
  periodic_rate: '0.01'
  rate: '0.12'
expect_error: FM-E001
expect_error_report:
  /pointer: /number_of_instalments
  /reason: range
  /errors/0/pointer: /number_of_instalments
  /errors/1/pointer: /periodic_rate
  /errors/1/reason: conflict
  /errors/1/pointers/1: /rate
  /errors/2/pointer: /principal
  /errors/3/pointer: /rounding/decimal_places
expect_length:
  /errors: '4'
