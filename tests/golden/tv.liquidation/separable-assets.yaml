method: tv.liquidation
description: Three assets, two liabilities, two liquidation costs and a tax on gains (R7)
source: Independent 50-digit reference, scripts/reference_tv.py; 800 + 300 + 200 - 600 - 250 - 40 - 60 - 30 = 320
input:
  assets: [{ label: Land, value: "800" }, { label: Plant, value: "300" }, { label: Receivables, value: "200" }]
  liabilities: [{ label: Bank loan, value: "600" }, { label: Suppliers, value: "250" }]
  liquidation_costs: [{ label: Legal fees, value: "40" }, { label: Closure, value: "60" }]
  basis: equity
  tax_on_gains: "30"
expect:
  terminal_value: "320"
  total_assets: "1300"
  total_liabilities: "850"
  total_liquidation_costs: "100"
tolerance: "0"
