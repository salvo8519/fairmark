# Reviewed equivalent mutants of fairmark-core.
#
# An equivalent mutant changes the code but cannot change any observable result, so no test
# can kill it. Each entry names exactly one mutation in one function at one line, with a
# one-line reason and the maintainer who reviewed it; an entry is added only in a reviewed
# pull request.
# Whole files, whole functions and patterns are never excluded: the rules are in
# docs/en/project/mutation-testing.md and `python scripts/mutants.py check-exclusions`
# enforces the format.
#
# Format (copy the mutation text exactly as cargo-mutants prints it, after "file:line:col: "):
#
#   [[equivalent]]
#   file = "crates/fairmark-core/src/<module>.rs"
#   function = "<function name as printed by cargo-mutants>"
#   mutation = "replace <= with < in <function>"
#   line = 123
#   reason = "<one line: why no observable result can change>"
#   reviewer = "<GitHub login of the maintainer who approved the entry>"
#
# All keys are required. The mutation must name its function: it ends with " in <function>"
# (a change inside the body) or starts with "replace <function> -> " or "replace <function>
# with " (the whole body replaced). The line is the one cargo-mutants prints; when the code
# moves, the entry is updated in the same pull request. Duplicate entries are rejected.
#
# Missed mutants listed here are still built and tested; scripts/mutants.py reports them as
# "equivalent" instead of "missed"; a full run lists entries whose mutant is no longer missed
# (now caught, unviable or gone), to be removed.

[[equivalent]]
file = "crates/fairmark-core/src/dcf/engine.rs"
function = "check_stages"
mutation = "replace && with || in check_stages"
line = 713
reason = "check_stages runs only on inputs whose defaults are filled in (registry, fcff, fcfe; compute_with_defaults requires it), and apply_defaults gives a projection to every stage with exactly one of flows and lines, so a stage without projection has both or neither, where && and || agree; Method::compute_with_defaults is public and its documented precondition is that the defaults were applied, so a caller that skips apply_defaults is outside its contract"
reviewer = "coordinator review pending"
