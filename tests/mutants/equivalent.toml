# Reviewed equivalent mutants of fairmark-core.
#
# An equivalent mutant changes the code but cannot change any observable result, so no test
# can kill it. Each entry names exactly one mutation in one function, with a one-line reason
# and the maintainer who reviewed it; an entry is added only in a reviewed pull request.
# Whole files, whole functions and patterns are never excluded: the rules are in
# docs/en/project/mutation-testing.md and `python scripts/mutants.py check-exclusions`
# enforces the format.
#
# Format (copy the mutation text exactly as cargo-mutants prints it, after "file:line:col: "):
#
#   [[equivalent]]
#   file = "crates/fairmark-core/src/<module>.rs"
#   function = "<function name as printed by cargo-mutants>"
#   mutation = "replace <= with < in <function>"
#   line = 123                # optional: pins one occurrence when the text repeats
#   reason = "<one line: why no observable result can change>"
#   reviewer = "<GitHub login of the maintainer who approved the entry>"
#
# Missed mutants listed here are still built and tested; scripts/mutants.py reports them as
# "equivalent" instead of "missed", and a full run lists entries that no longer match.

equivalent = []
